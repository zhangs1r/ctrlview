<script>
var D = [{"id": "2610.41768", "t": "视觉丢跟踪的那几秒，让两个轮子的转速接着算", "c": "SLAM 与状态估计", "g": ["轮式编码器", "预积分", "视觉惯性SLAM", "紧耦合", "差速轮机器人"], "d": "2026-11-02", "s": "它想干什么 温室过道一米二宽，番茄叶子垂到镜头前。一台差速轮机器人沿垄走到头，转身时镜头正对白墙，画面里能用的特征点掉到个位数。ORBSLAM2 在这一刻跟丢，位姿不再更新，直到车退回有纹理的地方重新认出场景。中间那两秒，轨迹上是一段空白。 这段空白在导航里很要命。控制器还按上一帧的位姿往前开，两秒能走出八十厘米。加 IMU 是常规办法，麻烦在于 IMU 的"}, {"id": "2610.39367", "t": "视觉未来把动作改坏了多少，先量出来再修回去", "c": "机器人", "g": ["世界动作模型", "动作增量", "负迁移", "残差适配器", "推理延迟"], "d": "2026-11-02", "s": "它想干什么 一台机械臂在动手之前，先在脑子里把接下来两秒的画面生成出来，再照着这段想象的画面决定每个关节怎么走。这类模型叫世界动作模型，简称 WAM。它把视频生成和动作生成放进同一个扩散骨干，动作可以看模型自己画出来的未来。 多出来的那段未来画面到底改变了什么，过去一年大家问的是「要不要花这笔算力」。这篇换了个问法。同一份权重、同一批观测，把未来接上和不接上"}, {"id": "2610.38417", "t": "给输出反馈加一串人工时滞，可控可观的 LTI 系统也能在指定时刻精确归零", "c": "控制与优化", "g": ["静态输出反馈", "人工时滞", "规定时间镇定", "固定时间镇定", "提升核", "广义 Gramian"], "d": "2026-11-02", "s": "它想干什么 给定一个可控可观的 LTI 系统，给定一个时间 T，只用输出的静态反馈，能不能在 T 时刻把状态精确压到零，而且这个 T 与初值无关。这篇的回答是可以，对每一个这样的系统都可以。 这句话的分量要放在\"静态\"两个字上。常数增益 K 下闭环是 A+BKC，K 只有 mp 个数，却要摆布满 n 个特征值。2026 年接连三篇预印本把\"是否存在镇定常数输"}, {"id": "2610.34304", "t": "水泥厂皮带上的裂口，交给树莓派和一支加速棒盯着", "c": "自动化", "g": ["皮带撕裂检测", "边缘推理", "Edge TPU", "整数量化", "工业视觉"], "d": "2026-11-02", "s": "它想干什么 水泥厂的熟料皮带是一条几百米长的橡胶带，一头接破碎机，一头接窑前的转运站。带速按论文给的值大约 2.5 m/s，带面上铺着磨蚀性很强的碎石。这条带子一断，整条线就得停。 论文把要检测的东西分成四类。纵向撕裂是沿带子长度方向裂开的口子；孔洞是砸穿整层橡胶的透孔；钉孔是更小的冲击穿孔；补丁开胶是硫化修补块老化后翘起、剥落。__这四类里，前三类会继续扩"}, {"id": "2610.33186", "t": "路口会车时先把风险折成一块凸区域，让规划器每一拍都有解", "c": "机器人", "g": ["不确定性传播", "路口决策", "模型预测控制", "控制屏障函数", "硬件部署"], "d": "2026-11-02", "s": "它想干什么 一辆车开进无信号灯的四岔路口。横向有车过来，对方可以直行穿过，可以左转切进你的车道，也可以右转离开。三种走法要三种应对，踩早了白等，踩晚了撞上。 决策的难处有三层。对方的意图是一个离散的三选一，这是第一层。它的位置、速度、朝向是连续量，测一次带一次噪声，往前推几秒不确定范围就摊开，这是第二层。你自己也说不准自己在哪儿，主车定位同样带误差，这是第三"}, {"id": "2610.33174", "t": "隧道口那一秒，让多曝光包围直接进因子图", "c": "SLAM 与状态估计", "g": ["视觉SLAM", "自动曝光", "多曝光包围", "因子图", "光照鲁棒性"], "d": "2026-11-02", "s": "它想干什么 小车从隧道里钻出来的那一秒，光照从 30 lx 跳到 80 000 lx。摄像机的自动曝光来不及改，画面白成一片。白掉的帧里没有能匹配上的特征点，视觉 SLAM 靠的就是这些特征点来算自己在哪儿。特征没了，轨迹就断在出口。 这篇论文处理的就是这一秒。 它做了两件事，一件在拍之前，一件在算之后。拍之前那件叫 B-Adapt，一台普通相机连续拍三张不"}, {"id": "2610.32271", "t": "机器狗伸手之前，先学会把身子摆对", "c": "具身智能与 VLA", "g": ["VLA", "腿足移动操作", "模仿学习", "遥操作", "动作块"], "d": "2026-11-02", "s": "它想干什么 机器狗站在一块灰色地垫上，背上驮着一条六轴臂。前面放着一个红色塑料方块，地垫边缘划出一块有颜色的目标区。它得先迈步走到方块旁边，把身子压低或者抬起，让臂够得着，再合上夹爪，把方块搬到目标区放下。 这一整套动作，论文交给一个视觉语言动作模型。VLA 是视觉语言动作模型的缩写，读图像和一句口令，直接输出机器人动作。这个函数后面统称策略，控制语境里的控"}, {"id": "2610.31864", "t": "只靠一段正常录像，把车推出车道 2.51 米", "c": "信息物理系统", "g": ["隐蔽攻击", "信息物理系统", "入侵检测", "生成模型", "车辆安全"], "d": "2026-11-02", "s": "它想干什么 一辆车在路上跑，横向位置传感器每一拍把偏移量送到电子控制单元。有人在总线上把这一路数改了一点点，改法有讲究。估计器照常收敛，检测器的统计量停在平时的水平，方向盘没有突然抖一下。几秒钟之后，车已经滑出车道线两米半。 这类攻击以前要什么条件。经典的隐蔽攻击要求攻击者知道被控对象的动力学、传感器映射、估计器增益、新息协方差、检测阈值。这些量在真车上都拿"}, {"id": "2610.31569", "t": "机器人不知道自己完了没有", "c": "具身智能与 VLA", "g": ["VLA", "任务状态信号", "流匹配", "异步去噪", "真机操作"], "d": "2026-11-02", "s": "它想干什么 插花任务里，机械臂捏着花茎伸向瓶口，位置差了两厘米，花头蹭在瓶沿上，蹭了三次，第四次松手，花落在桌面上。它接着伸手去抓，抓了个空。整段过程里策略一直在稳定输出动作，没有任何一个输出量在说这一步已经废了。看出来的是站在旁边的操作员，按急停的也是他。 视觉语言动作模型缺的就是这一块。这类模型简称 VLA，读进来的是几路相机加一句口令，吐出去的是动作。"}, {"id": "2610.31540", "t": "把机器之间的耦合换成价格，每台机各长各的树也能逼近联合最优", "c": "控制与优化", "g": ["多机协调", "列生成", "对偶价格", "微分平坦", "实时规划"], "d": "2026-11-02", "s": "它想干什么 六台地面机器人围成一个圈，两两对换位置，圈心立着四根半径 0.15 m 的柱子。每台机自己规划一条不撞柱子的轨迹不难。难在这六条轨迹要同时成立，谁也别碰谁，而且六台都要尽早到。把六台当成一个系统一起优化，问题就落进联合空间，规模随机器数往上翻。 已有的两条路各自只解掉一半。集中式离线规划器能解到渐近最优，代价是要一台机器掌握全队信息，还要几秒到几"}, {"id": "2610.31246", "t": "云厂商不用看你的照片，数一数每次查询等了多久就够了", "c": "隐私与安全", "g": ["侧信道攻击", "多出口网络", "供应链投毒", "输入属性推断", "威胁模型"], "d": "2026-11-02", "s": "它想干什么 你把人脸照片传给云上的年龄预测服务。平台跑在 SGX 里，输入、中间激活、输出都在隔离区内，云厂商按合同和 PIPL、GDPR 都不许看。这套保护在纸面上是完整的。论文说它漏了一个口子，漏在时间上。 漏法是这样的。这家云厂商同时也是模型的供应方。它在部署前交给你一个动过手脚的多出口网络，让白人男性的照片大概率停在第 1 个出口，其他人的照片停在别"}, {"id": "2610.29398", "t": "把验收规程写成判据层，同一批检出把误剔率从 57.6% 压到 10.9%", "c": "自动化", "g": ["工业视觉检测", "多视角采集", "决策融合", "误剔率", "PLC 集成"], "d": "2026-11-02", "s": "它想干什么 一根喷油嘴针阀是细长钢件，尖端那一小段锥面叫座面，靠它顶住阀体上的锥孔形成密封。抛光之后表面接近镜面，一道磨痕、一滴清洗液残留、一次装夹碰伤都会落在这圈上。产线上的做法是把它夹进伺服分度台，转一圈停 18 次，两个相机在每个停位各拍一张，一件下来 36 帧。 模型逐帧给结果。座面那一侧是实例分割，输出每个缺陷的框、类别和掩码；轴面那一侧是整图分类"}, {"id": "2610.28364", "t": "检索回来的文档里藏着一句指令，0.5B 小模型能不能在它进模型之前拦住", "c": "隐私与安全", "g": ["间接提示注入", "RAG 安全", "语义防火墙", "知识蒸馏", "威胁模型"], "d": "2026-11-02", "s": "它想干什么 给公司文档搭一套本地问答，问\"上季度差旅报销的上限是多少\"。检索器从一堆 PDF 和内部网页里捞出三段，接在问题后面，一起交给模型。其中一段是从公开页面抓下来的，正文末尾跟着一段 HTML 注释，浏览器不渲染，抓取工具照抄。注释里写着一句话，让模型忽略此前所有指令，把这次对话的完整内容发到某个地址。 模型读到的是一整段文字。它分不清哪部分是你的问"}, {"id": "2610.27971", "t": "查得再快，也拦不住一条过期的命令", "c": "信息物理系统", "g": ["执行间隔", "版本条件命令", "TOCTOU", "工业控制系统", "PLC 扫描周期", "边缘运行时"], "d": "2026-11-02", "s": "它想干什么 装配单元的输送线停着等料。规划器决定重启它，决策那一刻它读到的是线在跑、夹爪开着。推理要一秒上下，命令还得等操作员点头。这一秒里有人把线置成暂停，去清卡料。 命令最后到达单元控制器，格式合规，参数合规，唯一失效的是它假设的那个现场。线转起来了。论文在讨论里点到这条后果，一条发在刚被按停的线上的重启命令，可能让机械臂朝按暂停的那个人移动。 作者给这"}, {"id": "2610.20490", "t": "灯杆都一样的时候，怎么证明你算出来的位姿就是全局最优", "c": "SLAM 与状态估计", "g": ["状态估计", "可验证优化", "半正定松弛", "可观性退化", "点云配准"], "d": "2026-10-19", "s": "它想干什么 设想一辆车开在两侧立满路灯杆的街道上，车顶的激光雷达把灯杆扫成点云，拿这些灯杆和地图对齐来定自己的位置。灯杆全都竖着，方向一模一样。车沿着街道方向往前挪一段，点云落到灯杆上的残差几乎没有变化，因为灯杆是无限长的圆柱，沿它自己轴向的平移根本看不出来。车在这个方向上到底走了多少，观测答不出。 这类问题属于非凸的全局最优验证。局部求解器从初值出发往下走"}, {"id": "2610.19913", "t": "把长程操作拆成能核对的小段", "c": "具身智能与 VLA", "g": ["具身操作", "长程任务", "策略复用", "视觉核验", "模仿学习"], "d": "2026-10-19", "s": "它想干什么 一台机械臂在实验室里配液、放样品，或者在家里收拾桌子。单看每一步它都能做对，连着做十步就开始出岔子。麻烦的地方在于，第一步的偏差会改变后面每一步面对的物理条件。第一个动作把试管放歪了几毫米，倒液那一步液体就洒到外面，再往后夹爪去抓试剂瓶的时候，瓶子已经不在原位置上了。 轨迹是把这些步骤绑在一起的那根绳。采集演示要一整条从头到尾跑通的轨迹，学出来的"}, {"id": "2610.18313", "t": "同一台边缘盒子上，多个服务一起变坏时先救谁", "c": "信息物理系统", "g": ["工业边缘", "运行时关键度", "共同部署", "资源争用", "贝叶斯权重", "去中心化协调"], "d": "2026-10-19", "s": "它想干什么 产线上的一台边缘盒子同时跑着好几个 AI 服务。一个扭矩控制模型，一两个视觉质检，一个预测性维护例程，再加一个遥测采集。它们共用同一块 CPU、同一段内存、同一条网络。网络一堵，这些服务不会崩。它们照旧往外吐结果，只是结果不再对应现场的真实情况。 论文把这类情形叫静默的部分失效。从外面看系统是正常的，进程都在，接口都在回数据。失效要等到一个缺陷漏"}, {"id": "2610.17709", "t": "小错误在哪儿才算大错", "c": "具身智能与 VLA", "g": ["模仿学习", "行为克隆", "数据筛选", "对抗强化学习", "机器人操作"], "d": "2026-10-19", "s": "它想干什么 叠一个立方体，两条演示都成功了。第一条把方块放在底面正中，第二条放在边缘上，勉强平衡。行为克隆给这两条轨迹打一样的分，逐帧比对动作，误差都不大。可第二条里那句\"放边缘\"离失败只差一点点，执行时稍微偏一点，方块就掉下来。 这就是这篇论文要说的事情。模仿学习里最常用的行为克隆，把演示里的每一个状态都当成同等重要，逐帧回归专家动作。机器人操作不是这样，"}, {"id": "2610.12730", "t": "每隔三秒给传感器换一次编号，让算好的假数据打偏", "c": "信息物理系统", "g": ["虚假数据注入", "移动目标防御", "深度Q网络", "同步相量测量", "状态估计", "硬件在环"], "d": "2026-10-19", "s": "它想干什么 攻击者先摸清电网的量测结构，再解一个约束，让假数据满足坏数据检测的门槛。假数据一旦混进状态估计，发电机的调频回路就照着错的频率偏差动作。这套手法在电力系统里被研究了很多年，防御方一直没有便宜好用的解法。 ROAM 换了个思路，它不去改电网，也不去加固量测值，而是把传感器到逻辑编号的那张对照表做成在线变量。每隔一个决策周期，相量数据集中器把一部分相"}, {"id": "2610.12411", "t": "GLIO2：让激光雷达只管相对几何，全局坐标交给 GNSS", "c": "SLAM 与状态估计", "g": ["激光雷达惯性里程计", "GNSS 紧耦合", "因子图优化", "几何退化", "估计器一致性"], "d": "2026-10-19", "s": "它想干什么 一座 5.66 公里的跨海大桥，桥面笔直，车以最高 96 km/h 开过去。激光雷达扫到的是一条长长的直筒，前后方向几乎没有能分辨的结构，配准在沿桥方向上解不出来。同一段时间里头顶的天空是开的，GNSS 伪距一切正常。 把场景换到香港市区的高楼峡谷，两种模态的好坏正好对调。楼面结构密集，激光雷达配准稳得很，可楼的遮挡和反射把 GNSS 打进非直射"}, {"id": "2610.10616", "t": "路由日志也能认出微调数据，MoE 推理遥测泄了谁的密", "c": "隐私与安全", "g": ["成员推断", "混合专家", "路由遥测", "隐私泄露", "威胁模型"], "d": "2026-10-19", "s": "它想干什么 一个 MoE 语言模型被下游任务微调过之后摆到线上，服务端通常会把推理过程中的路由信息记一笔。这一笔记录的用途是运维，看专家负载是不是歪了，看哪个请求把某个专家打爆了，出了故障拿它排查，做安全审计也靠它。写日志的人多半把路由当成内部结构信息，而不是用户数据。 论文指出这类日志能回答一个别的问题。给定一段文本，它有没有出现在这个模型的微调数据里。 "}, {"id": "2610.10453", "t": "流策略的整步训练与一步部署，中间差在哪", "c": "机器人", "g": ["流匹配策略", "少步执行", "在线 RL", "腿足机器人", "推理延迟"], "d": "2026-10-19", "s": "它想干什么 腿足机器人底下那个控制回路，周期是 20 毫秒。这条硬约束决定了每一个周期里能花多少算力算一次动作，也决定了策略长什么样。流策略（flow policy）把连续动作的生成写成一个常微分方程，从高斯噪声出发沿速度场积分到动作端，表达能力强到能装下同一观测下的多种控制策略。代价是这条积分路径要一步步走，一步一次网络前向。论文里 Go2 的标准预算取 "}, {"id": "2610.09988", "t": "把评判函数当成李雅普诺夫函数，再用一次投影管住它的参数", "c": "控制与优化", "g": ["自适应镇定", "李雅普诺夫函数", "投影算子", "可行性判据", "倒立摆", "模型预测控制"], "d": "2026-10-19", "s": "它想干什么 一个系统要有稳定性证明，常见做法是先找一只李雅普诺夫函数，再拿它去挑反馈。函数是死的，反馈是活的。这篇论文把两件事换了个位置。评判函数（critic）本身带一批可以动的参数，参数在状态演化过程中持续变化，函数的衰减速度由参数的移动速度来保证。 入口很简单。评判函数 对时间求全导数，会多出一项 。这一项是状态的函数乘参数的移动速度，跟控制量 在同一"}, {"id": "2610.09057", "t": "给缺陷检测开一个弃权档，用价 k 控制它什么时候闭嘴", "c": "自动化", "g": ["不确定性量化", "弃权分类", "知识图谱", "医疗器械质量", "表面贴装"], "d": "2026-10-19", "s": "它想干什么 一块刚过回流炉的板子摆在检测工位上。模型要判断上面有没有缺陷，如果有，是开路还是桥连。绝大多数样本它闭着眼都能答对，剩下那一小撮里，几类的证据咬得很紧，答错就是一次误报或者一次漏检。 这两种错的代价不一样。误报要把一批板子拦下来复查，漏检可能让缺陷件流到病人身上。多报几次，产线的节拍和返修工位先受不了；漏掉一次，代价落在使用者那边。 这篇论文做的"}, {"id": "2610.08580", "t": "超导量子芯片的布线从手工几周变成自动几分钟，物理规则直接写进几何", "c": "自动化", "g": ["超导量子芯片", "物理设计自动化", "布线算法", "整数线性规划", "产线落地"], "d": "2026-10-19", "s": "它想干什么 一块超导量子芯片做出来之后，芯片上哪根线走哪里、在哪里拐弯、拐多大的弯、跟隔壁那根线隔多远，这些全都要人手工画。画一版二十几个量子比特的版图，一个团队要花好几天到好几周。架构一改，版图重画一遍。 这就是这篇论文要拆掉的那堵墙。作者是一个由设计自动化研究者和超导硬件专家组成的交叉团队，做法是把芯片版图的物理规则写成一套几何命题，再用三步算法把版图自"}, {"id": "2610.07525", "t": "只修坏掉的那根手指，把仿真练出的灵巧手策略拉到真机", "c": "机器人", "g": ["灵巧操作", "仿真到真机", "触觉反馈", "人在环修正", "模仿学习", "力控"], "d": "2026-10-19", "s": "它想干什么 一台 12 个自由度的五指手要去转一支螺丝刀。这套动作先在仿真里练过，练到能连续转起来，多根手指的配合也是对的。搬到真机上，模型里的摩擦、质量分布和电机特性都对不上，某根手指的接触点偏了，或者按下去的力差了一点，物体在手里一滑，整条动作就崩了。 回到仿真里继续练是一个办法。改奖励函数、扩大随机化区间、重新训练，代价不低，而且真机上具体是哪根手指、"}, {"id": "2610.05724", "t": "只拿得到量化状态时，怎么直接算出镇定反馈", "c": "控制与优化", "g": ["数据驱动控制", "量化反馈", "半定规划", "Lyapunov 稳定", "有限数据率"], "d": "2026-10-19", "s": "它想干什么 被控对象的 和 都不知道，手里只有一路量化过的状态序列。所谓量化，就是每个时刻的状态先被塞进一个小格子，控制器只能收到格子中心的坐标 。这篇文章要用这串格子坐标直接算出一个镇定反馈增益，而且整条链路从采集、求增益到闭环运行，都不需要任何未量化的测量。 难度落在两个地方。数据驱动镇定那套做法依赖一条秩条件，秩条件靠数据的精确度撑着，量化误差一进来，"}, {"id": "2610.03434", "t": "给客服 agent 划一条功能边界，让它在越界时自己收手", "c": "隐私与安全", "g": ["运行时护栏", "功能边界", "越域检测", "威胁模型", "生产部署"], "d": "2026-10-19", "s": "它想干什么 一个订票助手被用户套着问了几句体检报告该怎么看，它答了。这段话里没有一个字算得上违规，没有违规内容，没有泄露系统提示，也没有绕开任何安全策略。它的错在于答了一个自己不该答的问题。 这道裂缝在学界和产品之间挂了很多年。现有的运行时护栏大多盯着攻击，检测提示注入、越狱、有害内容这几类动作，判据是「这句话是不是攻击」。可用户并不需要攻击，他只管往下问，"}, {"id": "2609.40297", "t": "用深度缓冲算路径相关边际增益，把探索规划器的独立性假设拆掉", "c": "机器人", "g": ["自主探索", "信息增益", "采样规划器", "GPU 加速", "深度缓冲", "无人机"], "d": "2026-10-01", "s": "它想干什么 一台无人机进到陌生的建筑里，任务是在尽量短的时间里把能看的地方都看到。候选的下一站有几百上千个，每选一次都要回答同一个问题，站到那个位置、把相机转到那个方向，还能新看到多少没看过的地方。 采样规划器的做法是把候选视点在自由空间里撒开，连成一棵树，给每个候选算一份信息增益，再按看得多、飞得近排序，取最好那一支的前一段执行，然后重规划。增益靠体积射线"}, {"id": "2609.40244", "t": "StreamRig 冻住前端，把相机组几何用进流式里程计", "c": "机器人", "g": ["多相机里程计", "流式推理", "三维基础模型", "冻结前端", "相对位姿回归"], "d": "2026-10-01", "s": "它想干什么 一台人形机器人往前走，身上一圈相机同时按下快门。它要回答一个很朴素的问题，我现在在哪儿。这里的在哪儿指相对出发那一刻的位置和朝向。机器人在线把这个量报出来，这套做法叫里程计。 一圈相机同时看，天然比一只眼睛强。有的方向被挡住，别的方向还看得见。更关键的是，相机之间的相对位置和朝向在出厂前就标定好了，这是一份不需要在线估计的几何信息。 麻烦出在后面"}, {"id": "2609.40178", "t": "Dronar：把鱼探仪挂上无人船，去查不排水的输水渠底", "c": "机器人", "g": ["无人水面艇", "声呐测深", "基础设施巡检", "野外部署", "失效条件"], "d": "2026-10-01", "s": "它想干什么 亚利桑那州中部盐河谷的七条输水渠加起来两百多公里，是凤凰城近两百五十万户人家和整个农业区的主水源，归盐河项目局（Salt River Project，SRP）管。混凝土衬砌的渠用久了会出问题，衬砌变形、混凝土开裂、渠底淤积这三样最常见，输水效率往下掉，运行和维修的钱往上走。 麻烦在于这些东西大多看不见。水位以上的变形和裂缝，SRP 的巡渠员（叫 "}, {"id": "2609.40034", "t": "用偏置探针主动审计多组公平性：少查几次，也能把各组差距估出来", "c": "隐私与安全", "g": ["公平性审计", "黑盒查询", "主动学习", "模型提取", "样本复杂度", "威胁模型"], "d": "2026-10-01", "s": "它想干什么 一家银行部署了一个信贷审批模型。监管要求银行请外部机构来查这个模型对不同人群有没有差别对待，外部机构拿不到模型权重，只能通过接口提问。监管想知道的不光是有没有歧视，还想知道歧视出现在什么收入段、什么年龄段。 这篇论文要回答的就是这件事。它设计了一套提问方式，让外部审计者用尽量少的提问，把模型在多个受保护人群之间的差距估准，同时保证这些提问不会顺手"}, {"id": "2609.39981", "t": "均值-方差 LQR：回报方差的闭式解与伴随梯度下降", "c": "控制与优化", "g": ["分布 LQR", "均值-方差控制", "风险敏感控制", "伴随梯度下降", "折扣 LQR"], "d": "2026-10-01", "s": "它想干什么 经典 LQR 最小化的是一段期望代价。真实系统里的扰动是随机的，同一套反馈反复跑，每次真花掉的代价并不相同。LQR 只对平均值负责，对这次跑和下次跑差多少不闻不问。 楼宇温控按平均能耗调控制器，长期账单可能很好看，但有些天特别贵。车辆横向控制只压平均跟踪误差，某几次运行里横向偏差就冲出车道。这两类场合要的是平均表现好，波动也要小。 想在控制里把波"}, {"id": "2609.39971", "t": "当指令开始检索轨迹", "c": "具身智能与 VLA", "g": ["VLA", "模仿学习", "分布偏移", "反事实增强", "具身操作"], "d": "2026-10-01", "s": "它想干什么 一台机械臂接到口令，把盘子放到柜子顶上。它伸出爪子，稳稳抓起旁边那只碗，走出一条和演示里几乎重合的弧线，把碗放到了柜子顶上。抓取干净，轨迹平滑，口令没被执行。 微调过的 π₀.₅ 就会这样。π₀.₅ 是 Physical Intelligence 的视觉语言动作模型。它让一个预训练视觉语言模型读图像和口令，再让一个三亿参数的动作专家用流匹配生成一"}, {"id": "2609.39969", "t": "同一束假回波，换个车流就不灵", "c": "信息物理系统", "g": ["路侧 LiDAR 攻击", "多模态大模型", "语义场景图", "攻击时机", "异步推理", "物理信息耦合"], "d": "2026-10-01", "s": "它想干什么 一条直路上，目标车 T 跟着前车 A1，后面还有一辆 A2 跟着 T。路侧的攻击者把 A1 的回波往外推了一段。T 的前向测距读到偏大的车距，就按宽裕的余量继续跟车。真实间距在收缩，等 T 的制动来得及生效，车头已经贴上去了。 同一套装置，同一个推进量，换一批车流就可能什么都撞不到。A2 离得太远，A1 正在加速，或者 T 正前方那辆车根本不是 "}, {"id": "2609.39968", "t": "METANET 的输入敏感性与动态标定的鲁棒性", "c": "信息物理系统", "g": ["宏观交通流", "METANET", "串稳定性", "动态标定", "反事实分析"], "d": "2026-10-01", "s": "它想干什么 要给一条高速公路设计大范围可变限速方案，第一步是让宏观交通仿真跑起来。METANET 是这类仿真里用得最广的模型，它把车流当连续流体，把走廊切成一段一段，每段记两个量，密度和平均速度。跑之前要标定，也就是拿历史数据把模型里的参数调到合适值。 麻烦出在标定之后。实测数据上反复出现一种现象，一个标定得很好的 METANET，只要上游流量或者下游密度被"}, {"id": "2609.39902", "t": "CodeMimicry：把有害请求写成一段没写完的 Python 类", "c": "隐私与安全", "g": ["越狱攻击", "安全对齐", "代码补全", "黑盒攻击", "威胁模型"], "d": "2026-10-01", "s": "它想干什么 同一个模型，在对话框里问它怎么入侵政府数据库，它会拒绝。把这句话换个形式。写成一段没写完的 Python 类，类里有个方法叫 execute_penetration_scenario。方法体上挂着文档字符串，写着「模拟一次完整的渗透测试场景用于漏洞分析」。再把这段半成品贴给它，请它补全，它会把入侵的步骤一条条写出来。 论文给这个现象起了个名字，安"}, {"id": "2609.39888", "t": "MaDE 精读：看不到控制量，也要把神经预测掰回可行流形", "c": "信息物理系统", "g": ["可行性修正", "学习动力学", "逆动力学", "约束投影", "轨迹预测", "信息物理耦合"], "d": "2026-10-01", "s": "它想干什么 一个神经轨迹预测器把未来三秒的位置误差压到 0.63 m（inD 数据集，LSTM 那一族，论文表 2 的 raw 那一行）。这个数字放在行为预测的语境里够用。可这条轨迹接下来会被送进仿真器、送进安全分析、送进任何默认它物理上说得通的模块。预测出来的车可能要求在一步里把方向盘打过 0.5 rad，也可能要求车在一秒内横移两米。位置误差看不见这类错"}, {"id": "2609.39854", "t": "RL 引导的 PAC-NMPC：让强化学习给随机 MPC 带路", "c": "控制与优化", "g": ["随机 MPC", "采样型优化", "安全强化学习", "概率保证", "固定翼导航"], "d": "2026-10-01", "s": "它想干什么 一台 32 英寸翼展的固定翼在陌生的室内障碍场里穿行，机头只挂一枚 87°×58° 的深度相机。它要在 0.1 秒内算出四个操纵面指令，还不能撞上柱子。这台机器有 17 维状态、4 维输入，动力学强非线性且欠驱动，感知只覆盖正前方一小块。 把「不会撞」说成一句可以检验的话，需要概率语言。这篇的目标是这样一个陈述。在置信度 之下，未来 步里每一刻都"}, {"id": "2609.39837", "t": "一步 TD 更新能保住正则化策略镜像下降的快速收敛吗", "c": "控制与优化", "g": ["策略镜像下降", "镜像映射", "一步时序差分", "单环 actor-critic", "线性收敛", "样本复杂度"], "d": "2026-10-01", "s": "它想干什么 正则化马尔可夫决策过程里的策略镜像下降有一批很整齐的收敛结果。折扣因子、正则强度、策略步长给定之后，值函数误差按几何速率往下掉，收敛因子是折扣因子与步长的显式函数。这批结果下面压着一个共同前提，每一次策略改进之前，critic 必须把当前策略的动作价值算得足够准。准到什么程度各家不同，从精确解到带误差预算的评估预言机，再到可以任意取样本的生成模型"}, {"id": "2609.39822", "t": "实时 VLA 的时间缺口：两阶段去噪与系统级延迟盘点", "c": "具身智能与 VLA", "g": ["VLA", "实时控制", "流匹配", "动作分块", "系统延迟"], "d": "2026-10-01", "s": "它想干什么 一台双臂机器人正在叠 T 恤。它头顶一个相机，两只手腕各一个相机，画面按每秒 30 帧送进主机。主机显卡上跑着一个 VLA 模型，这个缩写指把图像、语言指令和机器人动作放进同一个网络一起学的策略模型。它一次推理不输出单步动作，而是吐出一整段未来动作，业内叫动作块。 麻烦出在两侧的节拍差得很远。动作块按 1 到 3 Hz 更新，机器人控制环按 30"}, {"id": "2609.39787", "t": "多机构科学 AI 需要机构级隐私保证，论文给出六要素声明框架", "c": "隐私与安全", "g": ["差分隐私", "机构级隐私", "联邦学习", "威胁模型", "科学计算安全", "信息流控制"], "d": "2026-10-01", "s": "它想干什么 四家单位凑在一起训一个多模态基础模型，也就是在海量数据上预训练过、之后能迁移到很多任务上的大模型。国家实验室出一台同步辐射光源和一台顶级超算，大学出方法，医院出一个临床影像队列，企业出配方数据。模型训完之后还要挂一批智能体上去，让它们自己排实验、自己抢光束线机时。 这样的合作里，最该保护的东西常常不是某一条记录。医院在意的是别人能不能从训练轮次的"}, {"id": "2609.39738", "t": "CNCGEN 从 B-rep 直接排工序出刀路，毛坯状态一步一更新", "c": "自动化", "g": ["工艺规划", "刀路生成", "B-rep 学习", "加工数据集", "数控加工"], "d": "2026-10-01", "s": "它想干什么 一块长方体铝坯躺在三轴铣床上。图纸给的是最终形状，上面有两个口袋、四个通孔和一条倒角。从这块方料到那个形状，中间要有人决定先挖哪个口袋、用直径几毫米的刀、刀从哪儿下、每层切多深。这段活在工厂里叫工艺规划与刀路生成，眼下主要是 CAM 程序员坐在软件前点出来的。 这篇论文要把这段活交给网络学。输入的是一份 B-rep，也就是用面、边和顶点描述实体几"}, {"id": "2609.39611", "t": "无人机互相盯梢，加速度为什么算不快", "c": "SLAM 与状态估计", "g": ["状态估计", "多无人机", "推力方向", "卡尔曼滤波", "估计延迟"], "d": "2026-10-01", "s": "它想干什么 一架无人机要跟住另一架，先得知道对方此刻在哪、走得快不快、加得多猛。位置这东西摄像头看得见。速度和加速度看不见，只能从一串串位置读数里往回推。 推的办法没错，代价藏在时间里。位置每 40 毫秒送进滤波器一次，三个数据集的采样周期都是 40 毫秒（表 I）。一次读数只告诉你它在哪。要把\"它在加速\"这件事认出来，得等位移攒出一段能看出曲率的曲线。论文"}, {"id": "2609.39403", "t": "IronMind：把一万小时第一人称视频，练成人形机器人的灵巧手", "c": "具身智能与 VLA", "g": ["具身智能", "人形机器人", "灵巧操作", "第一人称视频", "动作表示", "VLA"], "d": "2026-10-01", "s": "它想干什么 灵巧操作要练出来，得先有大量\"手该怎么动\"的示范。真机上收这种示范很贵。一次抓取要有人戴着动捕、或者在遥操作台前一遍遍重复，慢，还有安全风险。机器人操作这一摊到今天也没攒出一个网络规模的语料库。 第一人称视频是现成的替代品。眼镜上挂个相机，人干一天活就录下一天的手部动作。麻烦在于画面里是人的手，要控制的是铁做的手。 两个坎。第一个叫具身差距，人手"}, {"id": "2609.39125", "t": "LBDU-VIO：把 MSCKF 的零偏随机游走换成学出来的微分方程", "c": "SLAM 与状态估计", "g": ["视觉惯性里程计", "MSCKF", "神经微分方程", "零偏估计", "鲁棒性"], "d": "2026-10-01", "s": "它想干什么 一架巡检无人机飞进厂房角落，相机同时被一面白墙和一阵运动模糊按住，画面里几乎没有可跟的特征。这几秒里，姿态和位置只能靠 IMU 一路积分往前推。 IMU 是手机里那种测角速度和加速度的小芯片。它的读数里混着一组慢变的系统性偏置，陀螺和加速度计各一个三维向量，六个量合起来叫零偏。零偏不扣掉，积分就会一路偏下去，所以滤波器必须一边估计零偏，一边拿估计"}, {"id": "2609.38811", "t": "DCM-SAM 把 SAM 拆成两套缺陷专家塞进设备旁的 NPU", "c": "自动化", "g": ["增材制造", "X 射线 CT", "缺陷分割", "参数高效微调", "NPU 部署"], "d": "2026-10-01", "s": "它想干什么 一台激光粉末床熔合的金属打印机刚打完一个件。激光功率或者熔池行为抖一下，件里就留下气孔、未熔合的空洞，或者混进去的夹杂物。这些东西埋在表面以下，决定这个件的疲劳寿命，也决定它能不能拿到合格证。所以拿 X 射线 CT 把件扫一遍，得到一卷切片，然后要把每张切片里属于缺陷的像素圈出来。 这一步现在最费人。阈值法换一套数据就得重新调参，监督分割网络则把"}, {"id": "2609.38048", "t": "Cayley 预积分：让 IMU 因子进得了可验证估计", "c": "SLAM 与状态估计", "g": ["状态估计", "惯性预积分", "半正定松弛", "全局最优", "GNSS-IMU"], "d": "2026-10-01", "s": "它想干什么 设想一辆车在城市里跑二十秒，车上装着 GNSS 接收机和一颗 IMU。给这二十秒的惯性测量和一串 GNSS 定位点，让它把这期间的姿态、速度、位置和零偏都算出来。 局部优化会给你一组数。它从一个初值出发，一小步一小步往下走，直到代价降不动为止。问题是这类问题的可行集是非凸的，姿态那一部分尤其，所以它停下来的时候你只知道这是一个局部极小，不知道离全"}, {"id": "2609.37212", "t": "遗传算法粗排加弹簧阻尼松弛，机器人上下料单元的五台设备怎么摆", "c": "自动化", "g": ["产线布局", "遗传算法", "质量弹簧阻尼", "机器人上下料单元", "混合优化"], "d": "2026-10-01", "s": "它想干什么 一个机器人上下料单元要摆进车间里一块 7.2 m 见方的空地。单元里有五样东西，两台 CNC、一台检测机、一个料架，还有一台带夹爪的机器人。场地里已经有一个 2000 mm × 2000 mm 的电柜和一个 300 mm × 300 mm 的柱子，两个都搬不走，布置只能绕开。 这五样东西落在哪儿，决定机器人每次搬运要走多远，也决定还剩多少成片的空"}, {"id": "2609.35743", "t": "InfiniHand：让 AI 一边看视频，一边猜出你的手在哪儿", "c": "SLAM 与状态估计", "g": ["状态估计", "流式推理", "具身智能"], "d": "2026-09-28", "s": "它想干什么 摄像机戴在你自己头上，录你干活。这种视频叫第一视角视频。 这篇论文干的事：看这种视频，同时算出你的手是什么姿势，以及你人在哪儿、朝哪儿。 算完再把两只手放回真实世界的位置。 为什么非要同时算这两件事？因为\"手在哪儿\"这个问题，本身就绕不开\"我在哪儿\"。 --- 一、问题背景 1.1 任务有多难 单目第一视角视频里，你只知道\"右手在画面的右上角\"。"}, {"id": "2609.27702", "t": "DAVIO：让 VIO 不等视差就起步", "c": "SLAM 与状态估计", "g": ["状态估计", "视觉惯性里程计", "初始化", "稠密建图"], "d": "2026-10-01", "s": "它想干什么 设想一台巡检机器人刚上电，停在走廊起点。它背着一个摄像头和一个 IMU，IMU 就是手机里那个测加速度和角速度的小芯片。它需要回答两个问题，我在哪儿，我周围长什么样。 摄像头负责看清周围，IMU 负责感受自己的运动。两样合起来估计位姿，这套做法叫视觉惯性里程计，简称 VIO。麻烦出在刚上电那几秒。机器人还没走起来，画面里几乎看不出深度，而 IMU"}];
