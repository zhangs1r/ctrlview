var D = [{"id": "2609.40297", "t": "用深度缓冲算路径相关边际增益，把探索规划器的独立性假设拆掉", "c": "机器人", "g": ["自主探索", "信息增益", "采样规划器", "GPU 加速", "深度缓冲", "无人机"], "d": "2026-10-01", "s": "它想干什么 一台无人机进到陌生的建筑里，任务是在尽量短的时间里把能看的地方都看到。候选的下一站有几百上千个，每选一次都要回答同一个问题，站到那个位置、把相机转到那个方向，还能新看到多少没看过的地方。 采样规划器的做法是把候选视点在自由空间里撒开，连成一棵树，给每个候选算一份信息增益，再按看得多、飞得近排序，取最好那一支的前一段执行，然后重规划。增益靠体积射线"}, {"id": "2609.40244", "t": "StreamRig 冻住前端，把相机组几何用进流式里程计", "c": "机器人", "g": ["多相机里程计", "流式推理", "三维基础模型", "冻结前端", "相对位姿回归"], "d": "2026-10-01", "s": "它想干什么 一台人形机器人往前走，身上一圈相机同时按下快门。它要回答一个很朴素的问题，我现在在哪儿。这里的在哪儿指相对出发那一刻的位置和朝向。机器人在线把这个量报出来，这套做法叫里程计。 一圈相机同时看，天然比一只眼睛强。有的方向被挡住，别的方向还看得见。更关键的是，相机之间的相对位置和朝向在出厂前就标定好了，这是一份不需要在线估计的几何信息。 麻烦出在后面"}, {"id": "2609.40178", "t": "Dronar：把鱼探仪挂上无人船，去查不排水的输水渠底", "c": "机器人", "g": ["无人水面艇", "声呐测深", "基础设施巡检", "野外部署", "失效条件"], "d": "2026-10-01", "s": "它想干什么 亚利桑那州中部盐河谷的七条输水渠加起来两百多公里，是凤凰城近两百五十万户人家和整个农业区的主水源，归盐河项目局（Salt River Project，SRP）管。混凝土衬砌的渠用久了会出问题，衬砌变形、混凝土开裂、渠底淤积这三样最常见，输水效率往下掉，运行和维修的钱往上走。 麻烦在于这些东西大多看不见。水位以上的变形和裂缝，SRP 的巡渠员（叫 "}, {"id": "2609.40034", "t": "用偏置探针主动审计多组公平性：少查几次，也能把各组差距估出来", "c": "隐私与安全", "g": ["公平性审计", "黑盒查询", "主动学习", "模型提取", "样本复杂度", "威胁模型"], "d": "2026-10-01", "s": "它想干什么 一家银行部署了一个信贷审批模型。监管要求银行请外部机构来查这个模型对不同人群有没有差别对待，外部机构拿不到模型权重，只能通过接口提问。监管想知道的不光是有没有歧视，还想知道歧视出现在什么收入段、什么年龄段。 这篇论文要回答的就是这件事。它设计了一套提问方式，让外部审计者用尽量少的提问，把模型在多个受保护人群之间的差距估准，同时保证这些提问不会顺手"}, {"id": "2609.39981", "t": "均值-方差 LQR：回报方差的闭式解与伴随梯度下降", "c": "控制与优化", "g": ["分布 LQR", "均值-方差控制", "风险敏感控制", "伴随梯度下降", "折扣 LQR"], "d": "2026-10-01", "s": "它想干什么 经典 LQR 最小化的是一段期望代价。真实系统里的扰动是随机的，同一套反馈反复跑，每次真花掉的代价并不相同。LQR 只对平均值负责，对这次跑和下次跑差多少不闻不问。 楼宇温控按平均能耗调控制器，长期账单可能很好看，但有些天特别贵。车辆横向控制只压平均跟踪误差，某几次运行里横向偏差就冲出车道。这两类场合要的是平均表现好，波动也要小。 想在控制里把波"}, {"id": "2609.39971", "t": "当指令开始检索轨迹", "c": "具身智能与 VLA", "g": ["VLA", "模仿学习", "分布偏移", "反事实增强", "具身操作"], "d": "2026-10-01", "s": "它想干什么 一台机械臂接到口令，把盘子放到柜子顶上。它伸出爪子，稳稳抓起旁边那只碗，走出一条和演示里几乎重合的弧线，把碗放到了柜子顶上。抓取干净，轨迹平滑，口令没被执行。 微调过的 π₀.₅ 就会这样。π₀.₅ 是 Physical Intelligence 的视觉语言动作模型。它让一个预训练视觉语言模型读图像和口令，再让一个三亿参数的动作专家用流匹配生成一"}, {"id": "2609.39969", "t": "同一束假回波，换个车流就不灵", "c": "信息物理系统", "g": ["路侧 LiDAR 攻击", "多模态大模型", "语义场景图", "攻击时机", "异步推理", "物理信息耦合"], "d": "2026-10-01", "s": "它想干什么 一条直路上，目标车 T 跟着前车 A1，后面还有一辆 A2 跟着 T。路侧的攻击者把 A1 的回波往外推了一段。T 的前向测距读到偏大的车距，就按宽裕的余量继续跟车。真实间距在收缩，等 T 的制动来得及生效，车头已经贴上去了。 同一套装置，同一个推进量，换一批车流就可能什么都撞不到。A2 离得太远，A1 正在加速，或者 T 正前方那辆车根本不是 "}, {"id": "2609.39968", "t": "METANET 的输入敏感性与动态标定的鲁棒性", "c": "信息物理系统", "g": ["宏观交通流", "METANET", "串稳定性", "动态标定", "反事实分析"], "d": "2026-10-01", "s": "它想干什么 要给一条高速公路设计大范围可变限速方案，第一步是让宏观交通仿真跑起来。METANET 是这类仿真里用得最广的模型，它把车流当连续流体，把走廊切成一段一段，每段记两个量，密度和平均速度。跑之前要标定，也就是拿历史数据把模型里的参数调到合适值。 麻烦出在标定之后。实测数据上反复出现一种现象，一个标定得很好的 METANET，只要上游流量或者下游密度被"}, {"id": "2609.39902", "t": "CodeMimicry：把有害请求写成一段没写完的 Python 类", "c": "隐私与安全", "g": ["越狱攻击", "安全对齐", "代码补全", "黑盒攻击", "威胁模型"], "d": "2026-10-01", "s": "它想干什么 同一个模型，在对话框里问它怎么入侵政府数据库，它会拒绝。把这句话换个形式。写成一段没写完的 Python 类，类里有个方法叫 execute_penetration_scenario。方法体上挂着文档字符串，写着「模拟一次完整的渗透测试场景用于漏洞分析」。再把这段半成品贴给它，请它补全，它会把入侵的步骤一条条写出来。 论文给这个现象起了个名字，安"}, {"id": "2609.39888", "t": "MaDE 精读：看不到控制量，也要把神经预测掰回可行流形", "c": "信息物理系统", "g": ["可行性修正", "学习动力学", "逆动力学", "约束投影", "轨迹预测", "信息物理耦合"], "d": "2026-10-01", "s": "它想干什么 一个神经轨迹预测器把未来三秒的位置误差压到 0.63 m（inD 数据集，LSTM 那一族，论文表 2 的 raw 那一行）。这个数字放在行为预测的语境里够用。可这条轨迹接下来会被送进仿真器、送进安全分析、送进任何默认它物理上说得通的模块。预测出来的车可能要求在一步里把方向盘打过 0.5 rad，也可能要求车在一秒内横移两米。位置误差看不见这类错"}, {"id": "2609.39854", "t": "RL 引导的 PAC-NMPC：让强化学习给随机 MPC 带路", "c": "控制与优化", "g": ["随机 MPC", "采样型优化", "安全强化学习", "概率保证", "固定翼导航"], "d": "2026-10-01", "s": "它想干什么 一台 32 英寸翼展的固定翼在陌生的室内障碍场里穿行，机头只挂一枚 87°×58° 的深度相机。它要在 0.1 秒内算出四个操纵面指令，还不能撞上柱子。这台机器有 17 维状态、4 维输入，动力学强非线性且欠驱动，感知只覆盖正前方一小块。 把「不会撞」说成一句可以检验的话，需要概率语言。这篇的目标是这样一个陈述。在置信度 之下，未来 步里每一刻都"}, {"id": "2609.39837", "t": "一步 TD 更新能保住正则化策略镜像下降的快速收敛吗", "c": "控制与优化", "g": ["策略镜像下降", "镜像映射", "一步时序差分", "单环 actor-critic", "线性收敛", "样本复杂度"], "d": "2026-10-01", "s": "它想干什么 正则化马尔可夫决策过程里的策略镜像下降有一批很整齐的收敛结果。折扣因子、正则强度、策略步长给定之后，值函数误差按几何速率往下掉，收敛因子是折扣因子与步长的显式函数。这批结果下面压着一个共同前提，每一次策略改进之前，critic 必须把当前策略的动作价值算得足够准。准到什么程度各家不同，从精确解到带误差预算的评估预言机，再到可以任意取样本的生成模型"}, {"id": "2609.39822", "t": "实时 VLA 的时间缺口：两阶段去噪与系统级延迟盘点", "c": "具身智能与 VLA", "g": ["VLA", "实时控制", "流匹配", "动作分块", "系统延迟"], "d": "2026-10-01", "s": "它想干什么 一台双臂机器人正在叠 T 恤。它头顶一个相机，两只手腕各一个相机，画面按每秒 30 帧送进主机。主机显卡上跑着一个 VLA 模型，这个缩写指把图像、语言指令和机器人动作放进同一个网络一起学的策略模型。它一次推理不输出单步动作，而是吐出一整段未来动作，业内叫动作块。 麻烦出在两侧的节拍差得很远。动作块按 1 到 3 Hz 更新，机器人控制环按 30"}, {"id": "2609.39787", "t": "多机构科学 AI 需要机构级隐私保证，论文给出六要素声明框架", "c": "隐私与安全", "g": ["差分隐私", "机构级隐私", "联邦学习", "威胁模型", "科学计算安全", "信息流控制"], "d": "2026-10-01", "s": "它想干什么 四家单位凑在一起训一个多模态基础模型，也就是在海量数据上预训练过、之后能迁移到很多任务上的大模型。国家实验室出一台同步辐射光源和一台顶级超算，大学出方法，医院出一个临床影像队列，企业出配方数据。模型训完之后还要挂一批智能体上去，让它们自己排实验、自己抢光束线机时。 这样的合作里，最该保护的东西常常不是某一条记录。医院在意的是别人能不能从训练轮次的"}, {"id": "2609.39738", "t": "CNCGEN 从 B-rep 直接排工序出刀路，毛坯状态一步一更新", "c": "自动化", "g": ["工艺规划", "刀路生成", "B-rep 学习", "加工数据集", "数控加工"], "d": "2026-10-01", "s": "它想干什么 一块长方体铝坯躺在三轴铣床上。图纸给的是最终形状，上面有两个口袋、四个通孔和一条倒角。从这块方料到那个形状，中间要有人决定先挖哪个口袋、用直径几毫米的刀、刀从哪儿下、每层切多深。这段活在工厂里叫工艺规划与刀路生成，眼下主要是 CAM 程序员坐在软件前点出来的。 这篇论文要把这段活交给网络学。输入的是一份 B-rep，也就是用面、边和顶点描述实体几"}, {"id": "2609.39611", "t": "无人机互相盯梢，加速度为什么算不快", "c": "SLAM 与状态估计", "g": ["状态估计", "多无人机", "推力方向", "卡尔曼滤波", "估计延迟"], "d": "2026-10-01", "s": "它想干什么 一架无人机要跟住另一架，先得知道对方此刻在哪、走得快不快、加得多猛。位置这东西摄像头看得见。速度和加速度看不见，只能从一串串位置读数里往回推。 推的办法没错，代价藏在时间里。位置每 40 毫秒送进滤波器一次，三个数据集的采样周期都是 40 毫秒（表 I）。一次读数只告诉你它在哪。要把\"它在加速\"这件事认出来，得等位移攒出一段能看出曲率的曲线。论文"}, {"id": "2609.39403", "t": "IronMind：把一万小时第一人称视频，练成人形机器人的灵巧手", "c": "具身智能与 VLA", "g": ["具身智能", "人形机器人", "灵巧操作", "第一人称视频", "动作表示", "VLA"], "d": "2026-10-01", "s": "它想干什么 灵巧操作要练出来，得先有大量\"手该怎么动\"的示范。真机上收这种示范很贵。一次抓取要有人戴着动捕、或者在遥操作台前一遍遍重复，慢，还有安全风险。机器人操作这一摊到今天也没攒出一个网络规模的语料库。 第一人称视频是现成的替代品。眼镜上挂个相机，人干一天活就录下一天的手部动作。麻烦在于画面里是人的手，要控制的是铁做的手。 两个坎。第一个叫具身差距，人手"}, {"id": "2609.39125", "t": "LBDU-VIO：把 MSCKF 的零偏随机游走换成学出来的微分方程", "c": "SLAM 与状态估计", "g": ["视觉惯性里程计", "MSCKF", "神经微分方程", "零偏估计", "鲁棒性"], "d": "2026-10-01", "s": "它想干什么 一架巡检无人机飞进厂房角落，相机同时被一面白墙和一阵运动模糊按住，画面里几乎没有可跟的特征。这几秒里，姿态和位置只能靠 IMU 一路积分往前推。 IMU 是手机里那种测角速度和加速度的小芯片。它的读数里混着一组慢变的系统性偏置，陀螺和加速度计各一个三维向量，六个量合起来叫零偏。零偏不扣掉，积分就会一路偏下去，所以滤波器必须一边估计零偏，一边拿估计"}, {"id": "2609.38811", "t": "DCM-SAM 把 SAM 拆成两套缺陷专家塞进设备旁的 NPU", "c": "自动化", "g": ["增材制造", "X 射线 CT", "缺陷分割", "参数高效微调", "NPU 部署"], "d": "2026-10-01", "s": "它想干什么 一台激光粉末床熔合的金属打印机刚打完一个件。激光功率或者熔池行为抖一下，件里就留下气孔、未熔合的空洞，或者混进去的夹杂物。这些东西埋在表面以下，决定这个件的疲劳寿命，也决定它能不能拿到合格证。所以拿 X 射线 CT 把件扫一遍，得到一卷切片，然后要把每张切片里属于缺陷的像素圈出来。 这一步现在最费人。阈值法换一套数据就得重新调参，监督分割网络则把"}, {"id": "2609.38048", "t": "Cayley 预积分：让 IMU 因子进得了可验证估计", "c": "SLAM 与状态估计", "g": ["状态估计", "惯性预积分", "半正定松弛", "全局最优", "GNSS-IMU"], "d": "2026-10-01", "s": "它想干什么 设想一辆车在城市里跑二十秒，车上装着 GNSS 接收机和一颗 IMU。给这二十秒的惯性测量和一串 GNSS 定位点，让它把这期间的姿态、速度、位置和零偏都算出来。 局部优化会给你一组数。它从一个初值出发，一小步一小步往下走，直到代价降不动为止。问题是这类问题的可行集是非凸的，姿态那一部分尤其，所以它停下来的时候你只知道这是一个局部极小，不知道离全"}, {"id": "2609.37212", "t": "遗传算法粗排加弹簧阻尼松弛，机器人上下料单元的五台设备怎么摆", "c": "自动化", "g": ["产线布局", "遗传算法", "质量弹簧阻尼", "机器人上下料单元", "混合优化"], "d": "2026-10-01", "s": "它想干什么 一个机器人上下料单元要摆进车间里一块 7.2 m 见方的空地。单元里有五样东西，两台 CNC、一台检测机、一个料架，还有一台带夹爪的机器人。场地里已经有一个 2000 mm × 2000 mm 的电柜和一个 300 mm × 300 mm 的柱子，两个都搬不走，布置只能绕开。 这五样东西落在哪儿，决定机器人每次搬运要走多远，也决定还剩多少成片的空"}, {"id": "2609.35743", "t": "InfiniHand：让 AI 一边看视频，一边猜出你的手在哪儿", "c": "SLAM 与状态估计", "g": ["状态估计", "流式推理", "具身智能"], "d": "2026-09-28", "s": "它想干什么 摄像机戴在你自己头上，录你干活。这种视频叫第一视角视频。 这篇论文干的事：看这种视频，同时算出你的手是什么姿势，以及你人在哪儿、朝哪儿。 算完再把两只手放回真实世界的位置。 为什么非要同时算这两件事？因为\"手在哪儿\"这个问题，本身就绕不开\"我在哪儿\"。 --- 一、问题背景 1.1 任务有多难 单目第一视角视频里，你只知道\"右手在画面的右上角\"。"}, {"id": "2609.27702", "t": "DAVIO：让 VIO 不等视差就起步", "c": "SLAM 与状态估计", "g": ["状态估计", "视觉惯性里程计", "初始化", "稠密建图"], "d": "2026-10-01", "s": "它想干什么 设想一台巡检机器人刚上电，停在走廊起点。它背着一个摄像头和一个 IMU，IMU 就是手机里那个测加速度和角速度的小芯片。它需要回答两个问题，我在哪儿，我周围长什么样。 摄像头负责看清周围，IMU 负责感受自己的运动。两样合起来估计位姿，这套做法叫视觉惯性里程计，简称 VIO。麻烦出在刚上电那几秒。机器人还没走起来，画面里几乎看不出深度，而 IMU"}];
