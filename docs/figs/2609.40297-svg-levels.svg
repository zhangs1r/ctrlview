<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 400" width="880" height="400" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .ttl{fill:#1b1b1f;font-size:15px;font-weight:700}
    .lv{fill:#1b1b1f;font-size:12.5px;font-weight:700}
    .m{fill:#6b6b78;font-size:12px}
    .sub{fill:#6b6b78;font-size:11.5px}
    .ser{fill:#a8562d;font-size:12px;font-weight:700}
    .par{fill:#2f7a4f;font-size:12px;font-weight:700}
  </style>

  <text class="ttl" x="26" y="26">依赖只在层与层之间，同一层里的节点互不为祖先</text>

  <!-- 四层底色 -->
  <rect x="90" y="60" width="140" height="230" fill="#f4f6f8"/>
  <rect x="250" y="60" width="140" height="230" fill="#f4f6f8"/>
  <rect x="410" y="60" width="140" height="230" fill="#eef4ef"/>
  <rect x="570" y="60" width="140" height="230" fill="#f4f6f8"/>

  <text class="lv" x="160" y="80" text-anchor="middle">第 0 层</text>
  <text class="lv" x="320" y="80" text-anchor="middle">第 1 层</text>
  <text class="lv" x="480" y="80" text-anchor="middle">第 2 层</text>
  <text class="lv" x="640" y="80" text-anchor="middle">第 3 层</text>

  <!-- 边 -->
  <g stroke="#b9b6b0" stroke-width="1.4" fill="none">
    <line x1="160" y1="175" x2="320" y2="130"/>
    <line x1="160" y1="175" x2="320" y2="220"/>
    <line x1="320" y1="130" x2="480" y2="105"/>
    <line x1="320" y1="130" x2="480" y2="160"/>
    <line x1="320" y1="220" x2="480" y2="205"/>
    <line x1="320" y1="220" x2="480" y2="260"/>
    <line x1="480" y1="105" x2="640" y2="105"/>
    <line x1="480" y1="160" x2="640" y2="160"/>
    <line x1="480" y1="205" x2="640" y2="205"/>
    <line x1="480" y1="260" x2="640" y2="260"/>
  </g>

  <!-- 节点 -->
  <g fill="#1b1b1f">
    <circle cx="160" cy="175" r="9"/>
    <circle cx="320" cy="130" r="9"/>
    <circle cx="320" cy="220" r="9"/>
    <circle cx="480" cy="105" r="9"/>
    <circle cx="480" cy="160" r="9"/>
    <circle cx="480" cy="205" r="9"/>
    <circle cx="480" cy="260" r="9"/>
    <circle cx="640" cy="105" r="9"/>
    <circle cx="640" cy="160" r="9"/>
    <circle cx="640" cy="205" r="9"/>
    <circle cx="640" cy="260" r="9"/>
  </g>

  <!-- 层内并行的框 -->
  <rect x="418" y="84" width="124" height="200" fill="none" stroke="#2f7a4f" stroke-width="2" stroke-dasharray="6 4" rx="10"/>
  <text class="par" x="480" y="302" text-anchor="middle">层内并行</text>
  <text class="sub" x="480" y="320" text-anchor="middle">节点、候选 yaw、射线一起算</text>

  <!-- 层间串行的箭头 -->
  <line x1="160" y1="342" x2="636" y2="342" stroke="#a8562d" stroke-width="2"/>
  <polygon points="636,336 650,342 636,348" fill="#a8562d"/>
  <text class="ser" x="398" y="358" text-anchor="middle">层间串行　上一层写完深度缓冲，下一层才能读祖先的缓冲</text>

  <!-- 深度缓冲池 -->
  <rect x="726" y="96" width="132" height="80" fill="#eef3f8" stroke="#2d5f8a" stroke-width="1.6" rx="8"/>
  <text class="m" x="792" y="124" text-anchor="middle">深度缓冲池</text>
  <text class="sub" x="792" y="144" text-anchor="middle">GPU 显存</text>
  <text class="sub" x="792" y="162" text-anchor="middle">每个节点一张 Dₙ</text>
  <line x1="710" y1="180" x2="760" y2="180" stroke="#2d5f8a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="760,175 772,180 760,185" fill="#2d5f8a"/>
  <text class="sub" x="742" y="200" text-anchor="middle">写</text>
  <line x1="760" y1="216" x2="700" y2="216" stroke="#2d5f8a" stroke-width="1.8" stroke-dasharray="5 4"/>
  <polygon points="700,211 688,216 700,221" fill="#2d5f8a"/>
  <text class="sub" x="742" y="236" text-anchor="middle">读</text>

  <text class="sub" x="26" y="386">层号就是节点到根的边数。第 d 层求值时只读第 0 到第 d−1 层留下的缓冲，所以同层节点之间没有任何依赖。</text>
</svg>
