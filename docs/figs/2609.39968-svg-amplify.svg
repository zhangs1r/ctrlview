<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 520" width="1000" height="520" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="1000" height="520" fill="#ffffff"/>
  <defs>
    <marker id="arw" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a6b86"/>
    </marker>
    <marker id="arwr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#c0392b"/>
    </marker>
    <marker id="arwb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#1f6fb2"/>
    </marker>
  </defs>

  <!-- 输入框 -->
  <rect x="30" y="170" width="210" height="140" rx="8" fill="#eef2f6" stroke="#4a6b86" stroke-width="1.6"/>
  <text x="48" y="198" font-size="14" font-weight="700" fill="#16212b">传感器给出的边界条件</text>
  <text x="48" y="226" font-size="12" fill="#33475a">d(t) 含上游流量、</text>
  <text x="48" y="246" font-size="12" fill="#33475a">匝道流量、下游密度</text>
  <text x="48" y="274" font-size="12" fill="#33475a">d̃(t) = d(t) + ε(t)</text>
  <text x="48" y="294" font-size="12" fill="#33475a">‖ε(t)‖ ≤ ε̄，式(6)</text>

  <!-- 分叉 -->
  <path d="M240,240 H268" stroke="#4a6b86" stroke-width="2" fill="none"/>
  <path d="M268,112 V372" stroke="#4a6b86" stroke-width="2" fill="none"/>
  <path d="M268,112 H302" stroke="#4a6b86" stroke-width="2" fill="none" marker-end="url(#arw)"/>
  <path d="M268,372 H302" stroke="#4a6b86" stroke-width="2" fill="none" marker-end="url(#arw)"/>

  <!-- 上行 红色 放大 -->
  <rect x="310" y="80" width="90" height="64" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="355" y="119" font-size="13.5" fill="#8e2b20" text-anchor="middle">段 1</text>
  <rect x="440" y="80" width="90" height="64" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="485" y="119" font-size="13.5" fill="#8e2b20" text-anchor="middle">段 2</text>
  <rect x="570" y="80" width="90" height="64" rx="6" fill="#ffffff" stroke="#c0392b" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="615" y="119" font-size="16" fill="#8e2b20" text-anchor="middle">⋯</text>
  <rect x="700" y="80" width="90" height="64" rx="6" fill="#fdecea" stroke="#c0392b" stroke-width="1.6"/>
  <text x="745" y="119" font-size="13.5" fill="#8e2b20" text-anchor="middle">段 N</text>
  <path d="M400,112 H432" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arwr)"/>
  <path d="M530,112 H562" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arwr)"/>
  <path d="M660,112 H692" stroke="#c0392b" stroke-width="2" fill="none" marker-end="url(#arwr)"/>
  <text x="410" y="104" font-size="11.5" fill="#c0392b" text-anchor="middle">× g_A</text>
  <text x="540" y="104" font-size="11.5" fill="#c0392b" text-anchor="middle">× g_A</text>
  <text x="670" y="104" font-size="11.5" fill="#c0392b" text-anchor="middle">× g_A</text>
  <text x="812" y="98" font-size="13" font-weight="700" fill="#c0392b">峰值约 +4 dB</text>
  <text x="812" y="120" font-size="12.5" fill="#8e2b20">每段 × 1.585</text>
  <text x="812" y="140" font-size="12.5" fill="#8e2b20">逐段放大</text>

  <!-- 下行 蓝色 衰减 -->
  <rect x="310" y="340" width="90" height="64" rx="6" fill="#eaf2fa" stroke="#1f6fb2" stroke-width="1.6"/>
  <text x="355" y="379" font-size="13.5" fill="#17527f" text-anchor="middle">段 1</text>
  <rect x="440" y="340" width="90" height="64" rx="6" fill="#eaf2fa" stroke="#1f6fb2" stroke-width="1.6"/>
  <text x="485" y="379" font-size="13.5" fill="#17527f" text-anchor="middle">段 2</text>
  <rect x="570" y="340" width="90" height="64" rx="6" fill="#ffffff" stroke="#1f6fb2" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="615" y="379" font-size="16" fill="#17527f" text-anchor="middle">⋯</text>
  <rect x="700" y="340" width="90" height="64" rx="6" fill="#eaf2fa" stroke="#1f6fb2" stroke-width="1.6"/>
  <text x="745" y="379" font-size="13.5" fill="#17527f" text-anchor="middle">段 N</text>
  <path d="M400,372 H432" stroke="#1f6fb2" stroke-width="2" fill="none" marker-end="url(#arwb)"/>
  <path d="M530,372 H562" stroke="#1f6fb2" stroke-width="2" fill="none" marker-end="url(#arwb)"/>
  <path d="M660,372 H692" stroke="#1f6fb2" stroke-width="2" fill="none" marker-end="url(#arwb)"/>
  <text x="410" y="364" font-size="11.5" fill="#1f6fb2" text-anchor="middle">× g_B</text>
  <text x="540" y="364" font-size="11.5" fill="#1f6fb2" text-anchor="middle">× g_B</text>
  <text x="670" y="364" font-size="11.5" fill="#1f6fb2" text-anchor="middle">× g_B</text>
  <text x="812" y="358" font-size="13" font-weight="700" fill="#1f6fb2">全频段低于 0 dB</text>
  <text x="812" y="380" font-size="12.5" fill="#17527f">每段小于 1</text>
  <text x="812" y="400" font-size="12.5" fill="#17527f">逐段衰减</text>

  <!-- 底部判据条 -->
  <rect x="30" y="430" width="940" height="72" rx="8" fill="#fdf6e8" stroke="#b7791f" stroke-width="1.6"/>
  <text x="50" y="458" font-size="12.5" fill="#7a5210">判据（式16）　取 G(z) 的密度到密度分量，在 0 至 0.05 Hz 上求峰值，峰值越过 0 dB 就是空间放大。</text>
  <text x="50" y="482" font-size="12.5" fill="#7a5210">图 1 里的两组参数都取自标准参数范围 [13]，Scenario A 越过判据，Scenario B 没有。</text>
</svg>
