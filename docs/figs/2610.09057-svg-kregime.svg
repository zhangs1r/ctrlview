<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="560" fill="#ffffff"/>

  <text x="480" y="36" text-anchor="middle" font-size="18" font-weight="600" fill="#1f3552">价 k 的三段区间，以及实验实际扫到的位置</text>
  <text x="480" y="60" text-anchor="middle" font-size="13" fill="#5d7590">横轴为 k 的取值，纵轴无物理量。C 为类别数，合成基准取 3，MAUDE 报告任务取 4</text>

  <!-- 坐标轴 -->
  <line x1="80" y1="330" x2="900" y2="330" stroke="#3c5570" stroke-width="1.8"/>
  <path d="M906 330 L894 325 L894 335 Z" fill="#3c5570"/>
  <text x="906" y="360" font-size="14" fill="#3c5570" text-anchor="end">k</text>

  <!-- 刻度 -->
  <line x1="80" y1="330" x2="80" y2="340" stroke="#3c5570" stroke-width="1.4"/>
  <text x="80" y="360" font-size="12.5" fill="#5d7590" text-anchor="middle">0</text>
  <line x1="280" y1="330" x2="280" y2="340" stroke="#3c5570" stroke-width="1.4"/>
  <text x="280" y="360" font-size="12.5" fill="#5d7590" text-anchor="middle">1</text>
  <line x1="480" y1="330" x2="480" y2="340" stroke="#3c5570" stroke-width="1.4"/>
  <text x="480" y="360" font-size="12.5" fill="#5d7590" text-anchor="middle">2</text>
  <line x1="680" y1="330" x2="680" y2="340" stroke="#3c5570" stroke-width="1.4"/>
  <text x="680" y="360" font-size="12.5" fill="#5d7590" text-anchor="middle">C = 3</text>
  <line x1="880" y1="330" x2="880" y2="340" stroke="#3c5570" stroke-width="1.4"/>
  <text x="880" y="360" font-size="12.5" fill="#5d7590" text-anchor="middle">4</text>

  <!-- 三段区间 -->
  <rect x="80" y="196" width="200" height="52" fill="#f6dddd" stroke="#c98a8a"/>
  <text x="180" y="218" text-anchor="middle" font-size="13.5" font-weight="600" fill="#8a2f2f">全弃权</text>
  <text x="180" y="238" text-anchor="middle" font-size="11.5" fill="#a06060">把概率全压在弃权档上最优</text>

  <rect x="280" y="196" width="400" height="52" fill="#e9f5ec" stroke="#7aa88a" stroke-width="1.8"/>
  <text x="480" y="218" text-anchor="middle" font-size="13.5" font-weight="600" fill="#2f5f3f">混合区　弃权与预测并存</text>
  <text x="480" y="238" text-anchor="middle" font-size="11.5" fill="#4a7a5a">论文称这一段是最有意思的情形</text>

  <rect x="680" y="196" width="220" height="52" fill="#eef1f4" stroke="#b8c2cc"/>
  <text x="790" y="218" text-anchor="middle" font-size="13.5" font-weight="600" fill="#4a5866">不弃权</text>
  <text x="790" y="238" text-anchor="middle" font-size="11.5" fill="#6b7885">弃权档取零，按后验直接预测</text>

  <!-- 退化点 -->
  <line x1="280" y1="160" x2="280" y2="330" stroke="#8a7f4a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <line x1="680" y1="160" x2="680" y2="330" stroke="#8a7f4a" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="280" y="154" font-size="12" fill="#8a7f4a" text-anchor="middle">两端点退化，最优解不唯一</text>
  <line x1="240" y1="154" x2="320" y2="154" stroke="#8a7f4a" stroke-width="1"/>
  <line x1="640" y1="154" x2="720" y2="154" stroke="#8a7f4a" stroke-width="1"/>

  <!-- 实验取点 -->
  <circle cx="480" cy="196" r="5" fill="#1f3552"/>
  <circle cx="880" cy="196" r="5" fill="#ffffff" stroke="#1f3552" stroke-width="2"/>
  <line x1="480" y1="130" x2="480" y2="188" stroke="#1f3552" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="880" y1="130" x2="880" y2="188" stroke="#1f3552" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="480" y1="136" x2="880" y2="136" stroke="#1f3552" stroke-width="1.2"/>
  <text x="680" y="126" text-anchor="middle" font-size="12.5" fill="#1f3552">合成基准的消融把 k 一路扫进右侧这一段</text>

  <!-- 说明 -->
  <line x1="80" y1="404" x2="900" y2="404" stroke="#e2e8ef"/>
  <text x="80" y="432" font-size="13" fill="#3c5570">k 掉到 1 以下的判定说的是，让模型弃权的收益大于硬猜一个类别的收益，此时全部样本都该交给人工。</text>
  <text x="80" y="458" font-size="13" fill="#3c5570">k 抬到类别数以上，弃权档在最优解里恒为零，机制等于被关掉，精度回到不弃权时的水平。</text>
  <text x="80" y="484" font-size="13" fill="#3c5570">这段区间解释了为什么消融里精度随 k 变化会出现平台和陡降，拐点落在类别数附近。</text>
  <text x="80" y="522" font-size="12" fill="#8496a8">（编者绘制。区间划分来自论文定理 3.2，实验取点位置来自正文的合成与真实数据消融）</text>
</svg>
