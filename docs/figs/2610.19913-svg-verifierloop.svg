<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Helvetica, Arial, sans-serif">
  <rect width="960" height="600" fill="#ffffff"/>
  <text x="40" y="42" font-size="21" font-weight="bold" fill="#1a1a1a">示意图 B　一次尝试内部的核验门循环（编者绘制）</text>
  <text x="40" y="70" font-size="14" fill="#555555">一个单元每次尝试都走这张图。选择的策略模型在整次尝试里固定，门只在每 Δ 秒开一次。</text>

  <rect x="60" y="106" width="200" height="70" rx="6" fill="#eef3fb" stroke="#4a6fa5" stroke-width="1.6"/>
  <text x="160" y="134" font-size="14" font-weight="bold" text-anchor="middle" fill="#1f3d6b">启动检查 ιm = 1</text>
  <text x="160" y="157" font-size="12" text-anchor="middle" fill="#39527a">同帧画面与同一条记录</text>

  <line x1="260" y1="141" x2="320" y2="141" stroke="#555555" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="290" y="131" font-size="11" text-anchor="middle" fill="#555555">通过</text>

  <rect x="324" y="106" width="230" height="70" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="439" y="134" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">派发并启动策略模型</text>
  <text x="439" y="157" font-size="12" text-anchor="middle" fill="#333333">策略以原生频率连续输出动作</text>

  <line x1="554" y1="141" x2="614" y2="141" stroke="#555555" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="584" y="131" font-size="11" text-anchor="middle" fill="#555555">每 Δ 秒</text>

  <rect x="618" y="100" width="300" height="82" rx="6" fill="#fdf4e8" stroke="#a5762a" stroke-width="1.8"/>
  <text x="768" y="128" font-size="14" font-weight="bold" text-anchor="middle" fill="#7d5715">核验器裁定 y ∈ 三值</text>
  <text x="768" y="151" font-size="12" text-anchor="middle" fill="#8a6520">读 cᵢ⁺、cᵢ⁻、已用时与时限 Tᵢ</text>
  <text x="768" y="170" font-size="12" text-anchor="middle" fill="#8a6520">模拟器真值信号不参与这一步</text>

  <line x1="768" y1="182" x2="768" y2="222" stroke="#555555" stroke-width="1.6" marker-end="url(#ar2)"/>

  <rect x="618" y="226" width="300" height="58" rx="6" fill="#f2f7f0" stroke="#4a7a43" stroke-width="1.6"/>
  <text x="768" y="250" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2f5529">继续</text>
  <text x="768" y="271" font-size="12" text-anchor="middle" fill="#3b6334">保持当前策略，等下一个 Δ</text>

  <rect x="324" y="226" width="270" height="58" rx="6" fill="#f2f7f0" stroke="#4a7a43" stroke-width="1.6"/>
  <text x="459" y="250" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#2f5529">成功</text>
  <text x="459" y="271" font-size="12" text-anchor="middle" fill="#3b6334">记录边界，激活 i+1</text>

  <rect x="60" y="226" width="240" height="58" rx="6" fill="#fdeceb" stroke="#a5413a" stroke-width="1.6"/>
  <text x="180" y="250" font-size="13.5" font-weight="bold" text-anchor="middle" fill="#7d2b25">失败</text>
  <text x="180" y="271" font-size="12" text-anchor="middle" fill="#8a3831">超时或命中 cᵢ⁻ 也算失败</text>

  <line x1="618" y1="255" x2="594" y2="255" stroke="#555555" stroke-width="1.6" marker-end="url(#ar2)"/>
  <line x1="594" y1="255" x2="594" y2="255" stroke="#555555" stroke-width="1.6"/>
  <line x1="300" y1="255" x2="324" y2="255" stroke="#555555" stroke-width="1.6" marker-end="url(#ar2)"/>

  <rect x="60" y="330" width="420" height="104" rx="6" fill="#fdeceb" stroke="#a5413a" stroke-width="1.6"/>
  <text x="270" y="358" font-size="14" font-weight="bold" text-anchor="middle" fill="#7d2b25">失败后的级联检查</text>
  <text x="270" y="382" font-size="12.5" text-anchor="middle" fill="#8a3831">一、该单元此刻还能否启动</text>
  <text x="270" y="402" font-size="12.5" text-anchor="middle" fill="#8a3831">二、当前执行器还有没有重试余量</text>
  <text x="270" y="422" font-size="12.5" text-anchor="middle" fill="#8a3831">三、还有没有别的兼容执行器</text>

  <line x1="480" y1="382" x2="540" y2="382" stroke="#555555" stroke-width="1.6" marker-end="url(#ar2)"/>

  <rect x="544" y="330" width="376" height="104" rx="6" fill="#ffffff" stroke="#333333" stroke-width="1.8"/>
  <text x="732" y="358" font-size="14" font-weight="bold" text-anchor="middle" fill="#111111">三种去处</text>
  <text x="732" y="382" font-size="12.5" text-anchor="middle" fill="#333333">能启动且有重试余量，从当前物理状态重来</text>
  <text x="732" y="402" font-size="12.5" text-anchor="middle" fill="#333333">否则把该执行器划掉，换 q̂ 次高者</text>
  <text x="732" y="422" font-size="12.5" text-anchor="middle" fill="#333333">都不能，整个任务判失败</text>

  <path d="M270 434 L270 470 L732 470 L732 434" fill="none" stroke="#a5413a" stroke-width="1.6" stroke-dasharray="6 4" marker-end="url(#ar2)"/>
  <text x="500" y="492" font-size="12" text-anchor="middle" fill="#8a3831">回到启动检查。前面的核验结果与失败次数都写进历史，供下一次判定读</text>

  <text x="40" y="546" font-size="12.5" fill="#555555">绿色是应当继续或推进的分支，红色是必须处理的分支。整张图里没有任何一处把成功判据交给模拟器。</text>
  <text x="40" y="572" font-size="12.5" fill="#555555">时限 Tᵢ 由构造器按任务配置附上，不写在核验器的模型里。</text>

  <defs>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L9,4.5 L0,9 z" fill="#555555"/>
    </marker>
  </defs>
</svg>
