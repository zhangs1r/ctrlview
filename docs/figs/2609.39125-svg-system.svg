<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 620" width="980" height="620" font-family="Microsoft YaHei, PingFang SC, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="980" height="620" fill="#ffffff"/>

  <text x="26" y="30" font-size="18" font-weight="bold" fill="#0f172a">两个学习模块在滤波循环里的注入位置</text>

  <rect x="336" y="52" width="304" height="292" rx="12" fill="none" stroke="#94a3b8" stroke-width="1.6" stroke-dasharray="7 6"/>
  <text x="346" y="336" font-size="12.5" fill="#64748b">视觉中断时只剩这一圈在转</text>

  <rect x="360" y="70" width="260" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="490" y="103" font-size="14" text-anchor="middle" fill="#0f172a">原始 IMU 测量 ω̃, ã</text>

  <rect x="360" y="170" width="260" height="54" rx="8" fill="#ecfdf5" stroke="#2f9e44" stroke-width="1.8"/>
  <text x="490" y="193" font-size="13.5" text-anchor="middle" fill="#14532d">零偏扣除，状态传播（均值）</text>
  <text x="490" y="213" font-size="12" text-anchor="middle" fill="#166534">bₖ₊₁ = bₖ + f_θ(bₖ, tₖ) Δtₖ</text>

  <rect x="360" y="270" width="260" height="54" rx="8" fill="#ecfdf5" stroke="#2f9e44" stroke-width="1.8"/>
  <text x="490" y="293" font-size="13.5" text-anchor="middle" fill="#14532d">协方差传播</text>
  <text x="490" y="313" font-size="12" text-anchor="middle" fill="#166534">P⁻ = Φ P⁺ Φᵀ + G Qₖ Gᵀ Δtₖ</text>

  <rect x="360" y="420" width="260" height="54" rx="8" fill="#ffffff" stroke="#334155" stroke-width="1.6"/>
  <text x="490" y="443" font-size="13.5" text-anchor="middle" fill="#0f172a">MSCKF 视觉更新</text>
  <text x="490" y="462" font-size="12" text-anchor="middle" fill="#475569">视觉残差 rₖ 驱动修正，20 Hz</text>

  <line x1="490" y1="124" x2="490" y2="164" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="490" y1="224" x2="490" y2="264" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)"/>
  <line x1="490" y1="324" x2="490" y2="414" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)"/>
  <polyline points="360,447 335,447 335,302" fill="none" stroke="#334155" stroke-width="1.6" marker-end="url(#ah)"/>
  <text x="176" y="452" font-size="12.5" fill="#64748b">视觉修正回流</text>

  <rect x="24" y="166" width="286" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="38" y="190" font-size="13" font-weight="bold" fill="#334155">被替换之一　零偏演化模型</text>
  <rect x="38" y="200" width="258" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="167" y="221" font-size="12.5" text-anchor="middle" fill="#475569">随机游走（传统）</text>
  <text x="167" y="238" font-size="11.5" text-anchor="middle" fill="#64748b">ḃ = w_b，强度取常数</text>
  <line x1="167" y1="246" x2="167" y2="272" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="38" y="278" width="258" height="56" rx="6" fill="#ecfdf5" stroke="#2f9e44" stroke-width="1.6"/>
  <text x="167" y="300" font-size="12.5" text-anchor="middle" fill="#14532d">神经 ODE（本文）</text>
  <text x="167" y="318" font-size="11.5" text-anchor="middle" fill="#166534">ḃ = f_θ(b, S, Ṡ)，逐采样点积分</text>
  <polyline points="310,306 330,306 330,197 355,197" fill="none" stroke="#2f9e44" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="664" y="266" width="292" height="190" rx="10" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="678" y="290" font-size="13" font-weight="bold" fill="#334155">被替换之二　测量噪声协方差</text>
  <rect x="678" y="300" width="264" height="46" rx="6" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.3"/>
  <text x="810" y="321" font-size="12.5" text-anchor="middle" fill="#475569">固定噪声（传统）</text>
  <text x="810" y="338" font-size="11.5" text-anchor="middle" fill="#64748b">Q_ng = σ_g² I₃，抄数据手册</text>
  <line x1="810" y1="346" x2="810" y2="372" stroke="#334155" stroke-width="1.4" marker-end="url(#ah)"/>
  <rect x="678" y="378" width="264" height="56" rx="6" fill="#ecfdf5" stroke="#2f9e44" stroke-width="1.6"/>
  <text x="810" y="400" font-size="12.5" text-anchor="middle" fill="#14532d">学习噪声（本文）</text>
  <text x="810" y="418" font-size="11.5" text-anchor="middle" fill="#166534">Q_ng,k = diag(exp(D_g(hₖ)))</text>
  <polyline points="664,408 638,408 638,297 625,297" fill="none" stroke="#2f9e44" stroke-width="1.8" marker-end="url(#ah)"/>

  <rect x="26" y="512" width="16" height="16" rx="3" fill="#ecfdf5" stroke="#2f9e44" stroke-width="1.5"/>
  <text x="50" y="525" font-size="12.5" fill="#334155">本文学出来的部件</text>
  <rect x="196" y="512" width="16" height="16" rx="3" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="220" y="525" font-size="12.5" fill="#334155">被替换掉的传统部件</text>
  <rect x="420" y="512" width="16" height="16" rx="3" fill="none" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="444" y="525" font-size="12.5" fill="#334155">只有惯性传播在工作的区域</text>

  <text x="26" y="570" font-size="12.5" fill="#475569">零偏模型决定预测的均值，噪声模型决定预测的协方差，两者都作用在视觉更新之前的传播步上。</text>
  <text x="26" y="594" font-size="12.5" fill="#475569">视觉正常时，MSCKF 的更新会把这两个模型的误差按协方差加权拉回来。</text>
</svg>
