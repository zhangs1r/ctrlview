<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 960" width="960" height="960" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="960" height="960" fill="#ffffff"/>

  <text x="480" y="38" text-anchor="middle" font-size="18" font-weight="600" fill="#1f3552">取价 k 在 1 与类别数 C 之间时，模型在分界旁留白</text>
  <text x="480" y="64" text-anchor="middle" font-size="13" fill="#5d7590">三分类的概率单纯形，C = 3，图中取 k = 1.5，也就是刚好越过区间下界</text>

  <!-- 整个三角形铺一层留白色，三个接受区叠在上面，露出来的就是要留白的地方 -->
  <polygon points="480,66 940,826 20,826" fill="#e9f5ec" stroke="#7aa88a" stroke-width="1.6"/>

  <!-- 类别 1 接受区 -->
  <polygon points="55.4,812 263.5,812 389.5,651 314.6,92" fill="#cfe0f0" stroke="#6b8fb5" stroke-width="1.4"/>
  <text x="168" y="586" font-size="15" font-weight="600" fill="#2f4a6b">接受为类别 1</text>

  <!-- 类别 2 接受区 -->
  <polygon points="263.5,812 616.5,812 603.4,651 523.0,466.1" fill="#f8dfc4" stroke="#c68a48" stroke-width="1.4"/>
  <text x="470" y="766" font-size="15" font-weight="600" fill="#7a4d12">接受为类别 2</text>

  <!-- 类别 3 接受区 -->
  <polygon points="314.6,92 480,66 645.4,92 485.0,79.6" fill="#dcd4ec" stroke="#7a6ba8" stroke-width="1.4"/>
  <text x="700" y="150" font-size="14" font-weight="600" fill="#4a3f6b" text-anchor="end">类别 3 只在这个窄条里被接受</text>
  <line x1="640" y1="158" x2="540" y2="92" stroke="#4a3f6b" stroke-width="1.1"/>

  <!-- 三条判据的汇合点 -->
  <circle cx="389.5" cy="651" r="5.5" fill="#1f3552"/>
  <circle cx="523.0" cy="466.1" r="5.5" fill="#1f3552"/>
  <circle cx="603.4" cy="651" r="5.5" fill="#1f3552"/>
  <line x1="389.5" y1="651" x2="300" y2="651" stroke="#1f3552" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="523.0" y1="466.1" x2="556" y2="434" stroke="#1f3552" stroke-width="1.1" stroke-dasharray="4 3"/>
  <line x1="603.4" y1="651" x2="700" y2="651" stroke="#1f3552" stroke-width="1.1" stroke-dasharray="4 3"/>
  <text x="292" y="678" font-size="12.5" fill="#1f3552" text-anchor="end">留白从这里起　p̂₁ = k·p̂₃</text>
  <text x="564" y="430" font-size="12.5" fill="#1f3552">留白从这里起　p̂₂ = k·p̂₃</text>
  <text x="712" y="678" font-size="12.5" fill="#1f3552">两类都够不着，直接留白</text>

  <!-- 不作弃权时的三条分界，作参照 -->
  <line x1="480" y1="66" x2="480" y2="411.3" stroke="#8a99a8" stroke-width="1.2" stroke-dasharray="7 5"/>
  <line x1="480" y1="411.3" x2="310" y2="785" stroke="#8a99a8" stroke-width="1.2" stroke-dasharray="7 5"/>
  <line x1="480" y1="411.3" x2="680" y2="787" stroke="#8a99a8" stroke-width="1.2" stroke-dasharray="7 5"/>
  <circle cx="480" cy="411.3" r="4" fill="#8a99a8"/>
  <text x="480" y="396" font-size="12" fill="#8a99a8" text-anchor="middle">不作弃权时三条分界在此相交</text>

  <!-- 顶点标注 -->
  <text x="70" y="856" font-size="13" fill="#3c5570" text-anchor="middle">p̂₁ = 1</text>
  <text x="216" y="872" font-size="13" fill="#3c5570" text-anchor="middle">p̂₂ = 1</text>
  <text x="884" y="856" font-size="13" fill="#3c5570" text-anchor="middle">p̂₃ = 1</text>

  <!-- 图例 -->
  <rect x="60" y="900" width="18" height="14" rx="3" fill="#e9f5ec" stroke="#7aa88a"/>
  <text x="88" y="912" font-size="13" fill="#2f5f3f">弃权区，模型在这里不给结论</text>
  <rect x="330" y="900" width="18" height="14" rx="3" fill="#cfe0f0" stroke="#6b8fb5"/>
  <text x="358" y="912" font-size="13" fill="#2f4a6b">各类别的接受区</text>
  <line x1="600" y1="907" x2="640" y2="907" stroke="#8a99a8" stroke-width="1.4" stroke-dasharray="7 5"/>
  <text x="650" y="912" font-size="13" fill="#8a99a8">不作弃权时的分界</text>

  <text x="60" y="942" font-size="12.5" fill="#3c5570">两个坐标轴由三个类别概率转换而来，都不直接对应某个物理量。k 越小，浅绿色的带越宽。</text>
</svg>
