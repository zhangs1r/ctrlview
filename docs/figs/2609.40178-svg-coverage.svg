<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" width="560" height="330" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="560" height="330" fill="#ffffff"/>

  <!-- water body -->
  <rect x="60" y="92" width="440" height="178" fill="#dceaf7"/>
  <!-- water surface line -->
  <line x1="60" y1="92" x2="500" y2="92" stroke="#2b6cb0" stroke-width="1.6"/>
  <text x="62" y="86" font-size="12" fill="#2b6cb0">水面</text>

  <!-- canal walls (trapezoid, walls sloped) -->
  <polygon points="60,92 110,270 450,270 500,92" fill="none" stroke="#4a5568" stroke-width="2"/>
  <!-- canal bed line -->
  <line x1="110" y1="270" x2="450" y2="270" stroke="#2f855a" stroke-width="3"/>
  <text x="392" y="288" font-size="12" fill="#2f855a">渠底</text>

  <!-- sediment mound on bed -->
  <path d="M250,270 Q280,246 310,270 Z" fill="#b7791f" opacity="0.85"/>
  <text x="256" y="266" font-size="11" fill="#7b341e">淤泥</text>

  <!-- DownScan beam: 60 deg total, apex at transducer -->
  <polygon points="280,84 250,270 310,270" fill="#eb4d4b" opacity="0.18"/>
  <line x1="280" y1="84" x2="250" y2="270" stroke="#c53030" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="280" y1="84" x2="310" y2="270" stroke="#c53030" stroke-width="1.2" stroke-dasharray="4 3"/>

  <!-- SideScan beams: 58 deg each side from vertical -->
  <polygon points="280,84 60,92 60,150" fill="#805ad5" opacity="0.10"/>
  <polygon points="280,84 500,92 500,150" fill="#805ad5" opacity="0.10"/>

  <!-- transducer + boat -->
  <rect x="262" y="74" width="36" height="10" rx="3" fill="#4a5568"/>
  <line x1="280" y1="74" x2="280" y2="92" stroke="#4a5568" stroke-width="2"/>
  <text x="316" y="80" font-size="12" fill="#4a5568">换能器，浸在水面下</text>

  <!-- unreachable margins -->
  <line x1="110" y1="270" x2="250" y2="270" stroke="#c53030" stroke-width="2.4" opacity="0.55"/>
  <line x1="310" y1="270" x2="450" y2="270" stroke="#c53030" stroke-width="2.4" opacity="0.55"/>
  <line x1="110" y1="270" x2="130" y2="230" stroke="#c53030" stroke-width="2.4" opacity="0.55"/>
  <line x1="450" y1="270" x2="430" y2="230" stroke="#c53030" stroke-width="2.4" opacity="0.55"/>

  <!-- annotations -->
  <line x1="180" y1="240" x2="230" y2="200" stroke="#2d3748" stroke-width="1"/>
  <text x="96" y="196" font-size="12" fill="#2d3748">DownScan 打不到的两侧渠底与渠壁</text>

  <line x1="300" y1="180" x2="352" y2="152" stroke="#c53030" stroke-width="1"/>
  <text x="336" y="146" font-size="12" fill="#c53030">DownScan 波束，总张角 60°</text>

  <line x1="180" y1="116" x2="130" y2="130" stroke="#805ad5" stroke-width="1"/>
  <text x="66" y="146" font-size="12" fill="#805ad5">SideScan 波束，单侧 58°</text>

  <!-- depth scale -->
  <line x1="524" y1="92" x2="524" y2="270" stroke="#2d3748" stroke-width="1"/>
  <line x1="518" y1="92" x2="530" y2="92" stroke="#2d3748" stroke-width="1"/>
  <line x1="518" y1="270" x2="530" y2="270" stroke="#2d3748" stroke-width="1"/>
  <text x="534" y="186" font-size="12" fill="#2d3748">1 至 2 m</text>

  <!-- width scale -->
  <line x1="110" y1="300" x2="450" y2="300" stroke="#2d3748" stroke-width="1"/>
  <line x1="110" y1="294" x2="110" y2="306" stroke="#2d3748" stroke-width="1"/>
  <line x1="450" y1="294" x2="450" y2="306" stroke="#2d3748" stroke-width="1"/>
  <text x="222" y="318" font-size="12" fill="#2d3748">渠宽 15 至 20 m</text>
</svg>
