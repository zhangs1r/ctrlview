<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 470" width="920" height="470" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .t{font-size:15px;font-weight:700;fill:#1b1b1f}
    .h{font-size:13px;font-weight:700;fill:#1b1b1f}
    .b{font-size:12.5px;fill:#1b1b1f}
    .s{font-size:11.5px;fill:#6b6b78}
    .good{fill:#3f7d55}
    .bad{fill:#b85028}
  </style>

  <text class="t" x="30" y="32">平行灯杆下的不可观方向与切空间分解</text>

  <!-- LEFT: physical scene -->
  <rect x="24" y="48" width="420" height="396" rx="10" fill="#fbfbfa" stroke="#e6e4df" stroke-width="1.3"/>
  <text class="h" x="44" y="76">物理场景</text>
  <text class="s" x="44" y="96">参考线全部平行，方向 v∥ = [0,0,1]，长度单位是米</text>

  <line x1="56" y1="380" x2="412" y2="380" stroke="#c9c7c0" stroke-width="2"/>

  <g stroke="#8f8d86" stroke-width="7" stroke-linecap="round">
    <line x1="110" y1="380" x2="110" y2="150"/>
    <line x1="200" y1="380" x2="200" y2="180"/>
    <line x1="290" y1="380" x2="290" y2="140"/>
    <line x1="375" y1="380" x2="375" y2="185"/>
  </g>
  <text class="s" x="418" y="146" text-anchor="end">灯杆，当作无限长圆柱</text>

  <circle cx="200" cy="330" r="7" fill="#2d5f8a"/>
  <text class="b" x="212" y="326" fill="#2d5f8a">传感器</text>

  <line x1="200" y1="330" x2="330" y2="330" stroke="#3f7d55" stroke-width="2.4" marker-end="url(#g)"/>
  <text class="b good" x="228" y="320">横向移动，观测看得见</text>

  <line x1="290" y1="380" x2="290" y2="215" stroke="#b85028" stroke-width="2.4" stroke-dasharray="7 4" marker-end="url(#r)"/>
  <text class="b bad" x="300" y="228">沿 v∥ 平移，观测看不见</text>

  <text class="s" x="300" y="316" fill="#b85028">沿轴向挪一段，点到灯杆的距离不变</text>
  <text class="s" x="300" y="336" fill="#b85028">残差不变，代价也不变</text>

  <!-- RIGHT: tangent space -->
  <rect x="468" y="48" width="428" height="396" rx="10" fill="#fbfbfa" stroke="#e6e4df" stroke-width="1.3"/>
  <text class="h" x="488" y="76">切空间分解</text>
  <text class="s" x="488" y="96">论文未给 d_θ 的数值，右栏按式 (25) 的通用关系画</text>

  <g>
    <rect x="500" y="118" width="376" height="56" rx="6" fill="#f6f6f4" stroke="#d9d7d0" stroke-width="1.4"/>
    <text class="b" x="516" y="142">切空间 V = [ V_o　V_u ] ∈ O(d_θ)</text>
    <text class="s" x="516" y="162">前 d_o 列可观，后 d_u 列不可观，两组正交</text>
  </g>

  <line x1="688" y1="180" x2="688" y2="212" stroke="#9a9a9a" stroke-width="1.5" marker-end="url(#a)"/>

  <g>
    <rect x="500" y="218" width="176" height="92" rx="6" fill="#f2f7f3" stroke="#3f7d55" stroke-width="1.5"/>
    <text class="b good" x="516" y="244">可观子空间 V_o</text>
    <text class="b" x="516" y="266">维数 d_o = d_θ − d_u</text>
    <text class="s" x="516" y="288">式 (25) 的 θ(η) 只在这里挪动</text>

    <rect x="700" y="218" width="176" height="92" rx="6" fill="#fdf5f1" stroke="#b85028" stroke-width="1.5"/>
    <text class="b bad" x="716" y="244">不可观子空间 V_u</text>
    <text class="b" x="716" y="266">维数 d_u ≥ 1</text>
    <text class="s" x="716" y="288">零方差方向，被整体投影掉</text>
  </g>

  <rect x="500" y="330" width="376" height="98" rx="8" fill="#ffffff" stroke="#d9d7d0" stroke-width="1.3"/>
  <text class="b" x="516" y="354">自由度账本，以 §V-A 平行线为例</text>
  <text class="b" x="516" y="376">3 个平移自由度 − 平行线给的 2 个独立方程 = 1 维不可观</text>
  <text class="s" x="516" y="398">平移块 M̃_t,t 的零空间正是 v∥ 张成的那一维，</text>
  <text class="s" x="516" y="416">所以 d_u = 1，Schur 消去平移后剩 9 个旋转分量加 1 个齐次标量</text>

  <defs>
    <marker id="a" markerWidth="9" markerHeight="9" refX="4.5" refY="7" orient="auto"><path d="M0,9 L4.5,0 L9,9 z" fill="#9a9a9a"/></marker>
    <marker id="g" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#3f7d55"/></marker>
    <marker id="r" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#b85028"/></marker>
  </defs>
</svg>
