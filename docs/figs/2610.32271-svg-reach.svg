<svg xmlns="http://www.w3.org/2000/svg" width="900" height="432" viewBox="0 0 900 432" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="900" height="432" fill="#ffffff"/>

  <text x="24" y="34" font-size="20" font-weight="700" fill="#1b2a41">可达域跟着身子走</text>
  <text x="24" y="58" font-size="13" fill="#5a6b7d">俯视图。横纵是地面坐标，圆半径是臂能够到的水平距离。数值只示意，论文没有给。</text>

  <rect x="60" y="84" width="520" height="296" fill="#f5f7fa" stroke="#c7d2de"/>

  <!-- reachable disc A (target outside) -->
  <circle cx="180" cy="272" r="108" fill="#f7e7e5" stroke="#b3372f" stroke-width="1.4" stroke-dasharray="6 4"/>
  <circle cx="180" cy="272" r="3" fill="#b3372f"/>
  <text x="180" y="300" font-size="12" text-anchor="middle" fill="#8f2b25">落点一</text>

  <!-- reachable disc B (target inside) -->
  <circle cx="392" cy="244" r="108" fill="#dff1e5" fill-opacity="0.75" stroke="#1f5c37" stroke-width="1.4"/>
  <circle cx="392" cy="244" r="3" fill="#1f5c37"/>
  <text x="392" y="272" font-size="12" text-anchor="middle" fill="#1b4a2e">落点二</text>

  <!-- radius of B -->
  <line x1="392" y1="244" x2="496" y2="244" stroke="#1f5c37" stroke-width="1" stroke-dasharray="3 3"/>
  <text x="444" y="238" font-size="12" text-anchor="middle" fill="#1b4a2e">r</text>

  <!-- cube -->
  <rect x="446" y="176" width="22" height="22" fill="#b3372f" stroke="#8f2b25"/>
  <text x="457" y="168" font-size="12" text-anchor="middle" fill="#8f2b25">方块</text>

  <!-- target area -->
  <rect x="440" y="294" width="48" height="30" fill="#7fb3dd" stroke="#2d6a94"/>
  <text x="464" y="286" font-size="12" text-anchor="middle" fill="#2d6a94">目标区</text>

  <!-- walk arrow -->
  <path d="M186 316 Q 260 356 344 292" fill="none" stroke="#33475b" stroke-width="1.6" stroke-dasharray="7 4"/>
  <path d="M344 292 l -12 2 l 6 -11 z" fill="#33475b"/>
  <text x="232" y="352" font-size="12" fill="#33475b">先走这一段</text>

  <!-- legend -->
  <circle cx="616" cy="120" r="7" fill="#f7e7e5" stroke="#b3372f" stroke-dasharray="4 3"/>
  <text x="632" y="125" font-size="12.5" fill="#8f2b25">落点一的可达域，方块在外</text>
  <circle cx="616" cy="150" r="7" fill="#dff1e5" stroke="#1f5c37"/>
  <text x="632" y="155" font-size="12.5" fill="#1b4a2e">落点二的可达域，方块在内</text>

  <rect x="600" y="190" width="286" height="150" rx="8" fill="#eef4fb" stroke="#9dbcd8"/>
  <text x="616" y="214" font-size="13" font-weight="700" fill="#1f4e79">同一条臂，两个圆心</text>
  <text x="616" y="238" font-size="12" fill="#33556f">落点一里臂碰不到方块，误差</text>
  <text x="616" y="256" font-size="12" fill="#33556f">再小也没用，这是可达性问题。</text>
  <text x="616" y="280" font-size="12" fill="#33556f">落点二把方块圈进来之后，剩下</text>
  <text x="616" y="298" font-size="12" fill="#33556f">的才是表 I 量的末端定位精度。</text>
  <text x="616" y="322" font-size="12" fill="#5a6b7d">俯仰角改的是圆心的竖直位置，</text>
  <text x="616" y="338" font-size="12" fill="#5a6b7d">俯视图里看不出来。</text>
</svg>
