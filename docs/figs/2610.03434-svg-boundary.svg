<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 560" width="940" height="560" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .tb{fill:#1b1b1f;font-size:15px;font-weight:700}
    .hd{fill:#1b1b1f;font-size:13.5px;font-weight:650}
    .sm{fill:#6b6b78;font-size:12px}
    .cap{fill:#3c3c46;font-size:12.5px}
    .dot{font-size:12px;fill:#2a2a30}
    .in{fill:#d8ecdd;stroke:#6aa87c;stroke-width:1.5}
    .inb{fill:#f2f8f3;stroke:#6aa87c;stroke-width:2}
    .out{fill:#f7dcdc;stroke:#c07a7a;stroke-width:1.5}
    .unk{fill:#eceef2;stroke:#9a9ea8;stroke-width:1.5;stroke-dasharray:5 4}
    .ok{fill:#2f7d4f}
    .no{fill:#a83c3c}
  </style>

  <text class="tb" x="30" y="30">同一个正确的拒答，两条路子走的不是一条道</text>
  <text class="sm" x="30" y="52">矩形是某个 agent 的功能边界。绿色方块是它该接的请求，红色方块是它该拒的请求。</text>

  <!-- panel A -->
  <text class="hd" x="30" y="86">只写白名单</text>
  <rect x="30" y="98" width="400" height="340" rx="16" fill="#fbfbfc" stroke="#d8dade" stroke-width="1.5"/>
  <rect class="inb" x="70" y="150" width="320" height="230" rx="12"/>
  <text class="sm" x="86" y="174">边界内＝白名单枚举到的那些类别</text>
  <rect class="in" x="96" y="192" width="52" height="34" rx="5"/>
  <rect class="in" x="164" y="192" width="52" height="34" rx="5"/>
  <rect class="in" x="96" y="248" width="52" height="34" rx="5"/>
  <rect class="unk" x="252" y="248" width="110" height="34" rx="5"/>
  <text class="dot" x="264" y="270">没枚举到的正当请求</text>
  <rect class="out" x="96" y="318" width="52" height="34" rx="5"/>
  <rect class="out" x="164" y="318" width="52" height="34" rx="5"/>
  <rect class="out" x="232" y="318" width="52" height="34" rx="5"/>
  <text class="dot" x="300" y="340">越界与攻击</text>
  <text class="cap" x="96" y="392">没枚举到的正当请求也落在边界内</text>
  <text class="cap" x="96" y="414">判据是它在不在白名单里，它会被误拒</text>

  <!-- panel B -->
  <text class="hd" x="510" y="86">只写黑名单</text>
  <rect x="510" y="98" width="400" height="340" rx="16" fill="#fbfbfc" stroke="#d8dade" stroke-width="1.5"/>
  <rect class="inb" x="550" y="150" width="320" height="230" rx="12"/>
  <text class="sm" x="566" y="174">边界＝减去黑名单枚举到的那些类别</text>
  <rect class="in" x="576" y="192" width="52" height="34" rx="5"/>
  <rect class="in" x="644" y="192" width="52" height="34" rx="5"/>
  <rect class="in" x="712" y="192" width="52" height="34" rx="5"/>
  <rect class="in" x="576" y="248" width="52" height="34" rx="5"/>
  <rect class="in" x="644" y="248" width="52" height="34" rx="5"/>
  <rect class="unk" x="740" y="248" width="110" height="34" rx="5"/>
  <text class="dot" x="752" y="270">没枚举到的越界请求</text>
  <rect class="out" x="576" y="318" width="52" height="34" rx="5"/>
  <rect class="out" x="644" y="318" width="52" height="34" rx="5"/>
  <text class="cap" x="576" y="392">攻击写在名单上，拒得掉</text>
  <text class="cap" x="576" y="414">名单外的越界请求被当成正常请求放进去</text>

  <!-- footer -->
  <rect x="30" y="462" width="880" height="72" rx="10" fill="#faf9f7" stroke="#ddd9d2" stroke-width="1.5"/>
  <text class="sm" x="52" y="490">论文在 PAGE 上量到这两处失误的量级。白名单配到位之后，越界检测率从 57.3% 升到 93.5%；</text>
  <text class="sm" x="52" y="512">只写黑名单时越界检测率只有 14.5%，白名单把正当请求误拒的比例三档都停在 3.7% 上下。</text>
</svg>
