<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="900" height="420" fill="#ffffff"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L8 4.5 L0 9 Z" fill="#8496a8"/>
    </marker>
  </defs>

  <text x="30" y="32" font-size="15" font-weight="600" fill="#1f3552">攻击者的写入面与防火墙的位置</text>

  <!-- trust boundary -->
  <rect x="20" y="96" width="512" height="136" rx="10" fill="#fdf5f4" stroke="#c0655a" stroke-width="1.4" stroke-dasharray="6 4"/>
  <text x="30" y="86" font-size="11.5" fill="#b0574c">攻击者能改的地方</text>

  <!-- attacker -->
  <rect x="34" y="124" width="96" height="72" rx="8" fill="#f7dedb" stroke="#c0655a" stroke-width="1.6"/>
  <text x="82" y="156" font-size="13" font-weight="600" fill="#8f3d33" text-anchor="middle">攻击者</text>
  <text x="82" y="178" font-size="11" fill="#a2564b" text-anchor="middle">写内容</text>

  <!-- corpus -->
  <rect x="166" y="124" width="170" height="72" rx="8" fill="#ffffff" stroke="#9aa9b8" stroke-width="1.4"/>
  <text x="251" y="152" font-size="13" font-weight="600" fill="#1f3552" text-anchor="middle">语料库</text>
  <text x="251" y="174" font-size="11" fill="#5d7590" text-anchor="middle">网页 · 文档 · 记忆条目</text>

  <!-- retriever -->
  <rect x="372" y="124" width="140" height="72" rx="8" fill="#ffffff" stroke="#9aa9b8" stroke-width="1.4"/>
  <text x="442" y="152" font-size="13" font-weight="600" fill="#1f3552" text-anchor="middle">检索器</text>
  <text x="442" y="174" font-size="11" fill="#5d7590" text-anchor="middle">取回 top-k 片段 C</text>

  <line x1="130" y1="160" x2="164" y2="160" stroke="#8496a8" stroke-width="1.6" marker-end="url(#ar)"/>
  <line x1="336" y1="160" x2="370" y2="160" stroke="#8496a8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- firewall -->
  <rect x="566" y="118" width="156" height="84" rx="8" fill="#f2f9f4" stroke="#3f8f5f" stroke-width="1.8"/>
  <text x="644" y="148" font-size="13" font-weight="600" fill="#2c6b46" text-anchor="middle">0.5B 防火墙</text>
  <text x="644" y="172" font-size="12" fill="#3f7d57" text-anchor="middle">读 [Q] ‖ [C]</text>
  <line x1="512" y1="160" x2="564" y2="160" stroke="#8496a8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="538" y="150" font-size="10.5" fill="#a2564b" text-anchor="middle">C 越界</text>

  <!-- query -->
  <rect x="566" y="36" width="156" height="54" rx="8" fill="#f0f5fa" stroke="#2f6fa8" stroke-width="1.6"/>
  <text x="644" y="68" font-size="13" font-weight="600" fill="#1f4f7a" text-anchor="middle">用户问题 Q</text>
  <line x1="644" y1="90" x2="644" y2="116" stroke="#2f6fa8" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="734" y="66" font-size="11" fill="#5d7590">假定善意</text>

  <!-- generator -->
  <rect x="762" y="124" width="112" height="72" rx="8" fill="#ffffff" stroke="#9aa9b8" stroke-width="1.4"/>
  <text x="818" y="156" font-size="13" font-weight="600" fill="#1f3552" text-anchor="middle">生成器</text>
  <text x="818" y="178" font-size="11" fill="#5d7590" text-anchor="middle">只读放行的片段</text>
  <line x1="722" y1="160" x2="760" y2="160" stroke="#8496a8" stroke-width="1.6" marker-end="url(#ar)"/>

  <!-- three outcomes -->
  <g stroke="#c3cfdb" stroke-width="1.2" fill="none">
    <path d="M644 202 L512 246"/>
    <path d="M644 202 L616 246"/>
    <path d="M644 202 L726 246"/>
  </g>
  <rect x="470" y="250" width="84" height="46" rx="7" fill="#f2f9f4" stroke="#3f8f5f" stroke-width="1.4"/>
  <text x="512" y="278" font-size="12" fill="#2c6b46" text-anchor="middle">safe</text>
  <rect x="566" y="250" width="100" height="46" rx="7" fill="#fdf8ee" stroke="#c98a3c" stroke-width="1.4"/>
  <text x="616" y="278" font-size="12" fill="#9a6a28" text-anchor="middle">suspicious</text>
  <rect x="678" y="250" width="100" height="46" rx="7" fill="#fdf5f4" stroke="#c0655a" stroke-width="1.4"/>
  <text x="728" y="278" font-size="12" fill="#8f3d33" text-anchor="middle">恶意指令</text>

  <text x="30" y="348" font-size="11.5" fill="#6d8298">红框以内是威胁模型交给攻击者的地方，用户问题 Q 在框外，论文假定它善意。</text>
  <text x="30" y="372" font-size="11.5" fill="#6d8298">判定发生在片段 C 进入生成器之前，三个标签是这道门唯一允许的输出。</text>
  <text x="30" y="396" font-size="10.5" fill="#93a3b3">论文未测的情形另算，包括梯度攻击、多片段拼接、检索侧优化和人工红队。</text>
</svg>
