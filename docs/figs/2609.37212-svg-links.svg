<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 430" width="960" height="430" font-family="DejaVu Sans, Source Han Sans SC, Microsoft YaHei, sans-serif">
  <rect x="0" y="0" width="960" height="430" fill="#ffffff"/>
  <text x="24" y="34" font-size="20" font-weight="bold" fill="#111111">工序链与两类弹簧阻尼链的对应</text>
  <text x="24" y="58" font-size="14" fill="#555555">五台设备里只有机器人是搬运资源，其余四台是被搬运资源</text>

  <rect x="30" y="76" width="560" height="330" fill="#f7f9fc" stroke="#c8d3e0"/>
  <text x="46" y="100" font-size="14" fill="#333333">场地 7200 mm × 7200 mm，灰块为两个固定障碍</text>

  <rect x="60" y="120" width="110" height="56" fill="#ffe873" stroke="#b8a02a" stroke-width="1.5"/>
  <text x="115" y="154" font-size="15" text-anchor="middle" fill="#111111">料架</text>

  <rect x="430" y="120" width="120" height="56" fill="#ffe873" stroke="#b8a02a" stroke-width="1.5"/>
  <text x="490" y="154" font-size="15" text-anchor="middle" fill="#111111">CNC 1</text>

  <rect x="410" y="300" width="120" height="56" fill="#ffe873" stroke="#b8a02a" stroke-width="1.5"/>
  <text x="470" y="334" font-size="15" text-anchor="middle" fill="#111111">CNC 2</text>

  <rect x="80" y="300" width="120" height="56" fill="#7fe0d0" stroke="#2c8f80" stroke-width="1.5"/>
  <text x="140" y="334" font-size="15" text-anchor="middle" fill="#111111">检测机</text>

  <line x1="115" y1="176" x2="278" y2="222" stroke="#1f9d55" stroke-width="3"/>
  <line x1="430" y1="148" x2="300" y2="208" stroke="#1f9d55" stroke-width="3"/>
  <line x1="410" y1="322" x2="302" y2="250" stroke="#1f9d55" stroke-width="3"/>
  <line x1="200" y1="322" x2="258" y2="252" stroke="#1f9d55" stroke-width="3"/>

  <line x1="170" y1="148" x2="430" y2="148" stroke="#d0342c" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="490" y1="176" x2="470" y2="300" stroke="#d0342c" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="410" y1="328" x2="200" y2="328" stroke="#d0342c" stroke-width="3" stroke-dasharray="9 6"/>
  <line x1="140" y1="300" x2="140" y2="176" stroke="#d0342c" stroke-width="3" stroke-dasharray="9 6"/>

  <circle cx="278" cy="222" r="34" fill="#1f4e9c"/>
  <text x="278" y="228" font-size="14" text-anchor="middle" fill="#ffffff">机器人</text>

  <rect x="600" y="76" width="336" height="330" fill="#ffffff" stroke="#c8d3e0"/>
  <line x1="618" y1="112" x2="672" y2="112" stroke="#1f9d55" stroke-width="3"/>
  <text x="684" y="117" font-size="15" fill="#111111">reachability 链</text>
  <text x="618" y="142" font-size="13" fill="#444444">加在机器人与每台非搬运</text>
  <text x="618" y="162" font-size="13" fill="#444444">资源之间，四道工序各一条</text>
  <text x="618" y="186" font-size="13" fill="#444444">弹簧常数按规划期内的搬</text>
  <text x="618" y="206" font-size="13" fill="#444444">运次数配置</text>

  <line x1="618" y1="248" x2="672" y2="248" stroke="#d0342c" stroke-width="3" stroke-dasharray="9 6"/>
  <text x="684" y="253" font-size="15" fill="#111111">closeness 链</text>
  <text x="618" y="278" font-size="13" fill="#444444">加在同一台机器人先后服</text>
  <text x="618" y="298" font-size="13" fill="#444444">务的两个非搬运资源之间</text>
  <text x="618" y="322" font-size="13" fill="#444444">弹簧常数是搬运次数乘一</text>
  <text x="618" y="342" font-size="13" fill="#444444">个 closeness 因子，用来压</text>
  <text x="618" y="362" font-size="13" fill="#444444">机器人回转半径</text>
  <text x="618" y="390" font-size="12" fill="#777777">两端为无限质量碰撞体，不参与弹簧</text>
</svg>
