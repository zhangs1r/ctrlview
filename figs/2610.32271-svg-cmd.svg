<svg xmlns="http://www.w3.org/2000/svg" width="960" height="452" viewBox="0 0 960 452" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="960" height="452" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="700" fill="#1b2a41">一条十一维指令，两个消费端</text>
  <text x="24" y="60" font-size="13" fill="#5a6b7d">前四位进底盘，后七位进臂与夹爪。底盘只收瞬时量，臂一次吃掉整块。</text>

  <!-- 11 cells -->
  <g font-size="15" text-anchor="middle">
    <rect x="70" y="92" width="64" height="58" rx="5" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="102" y="128" fill="#1b3b5c">vx</text>
    <rect x="140" y="92" width="64" height="58" rx="5" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="172" y="128" fill="#1b3b5c">vy</text>
    <rect x="210" y="92" width="64" height="58" rx="5" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="242" y="128" fill="#1b3b5c">ωz</text>
    <rect x="280" y="92" width="64" height="58" rx="5" fill="#dce9f7" stroke="#1f4e79" stroke-width="1.2"/>
    <text x="312" y="128" fill="#1b3b5c">θ</text>

    <rect x="350" y="92" width="64" height="58" rx="5" fill="#dff1e5" stroke="#1f5c37" stroke-width="1.2"/>
    <text x="382" y="128" fill="#1b4a2e">q₁</text>
    <rect x="420" y="92" width="64" height="58" rx="5" fill="#dff1e5" stroke="#1f5c37" stroke-width="1.2"/>
    <text x="452" y="128" fill="#1b4a2e">q₂</text>
    <rect x="490" y="92" width="64" height="58" rx="5" fill="#dff1e5" stroke="#1f5c37" stroke-width="1.2"/>
    <text x="522" y="128" fill="#1b4a2e">q₃</text>
    <rect x="560" y="92" width="64" height="58" rx="5" fill="#dff1e5" stroke="#1f5c37" stroke-width="1.2"/>
    <text x="592" y="128" fill="#1b4a2e">q₄</text>
    <rect x="630" y="92" width="64" height="58" rx="5" fill="#dff1e5" stroke="#1f5c37" stroke-width="1.2"/>
    <text x="662" y="128" fill="#1b4a2e">q₅</text>
    <rect x="700" y="92" width="64" height="58" rx="5" fill="#dff1e5" stroke="#1f5c37" stroke-width="1.2"/>
    <text x="732" y="128" fill="#1b4a2e">q₆</text>

    <rect x="770" y="92" width="64" height="58" rx="5" fill="#f7efe0" stroke="#8a6b3a" stroke-width="1.2"/>
    <text x="802" y="128" fill="#5d4520">g</text>
  </g>

  <!-- brackets -->
  <g stroke="#1f4e79" stroke-width="1.4" fill="none">
    <path d="M70 158 v8 h274 v-8"/>
  </g>
  <text x="207" y="186" font-size="13" text-anchor="middle" fill="#1f4e79">底盘四位</text>

  <g stroke="#1f5c37" stroke-width="1.4" fill="none">
    <path d="M350 158 v8 h414 v-8"/>
  </g>
  <text x="557" y="186" font-size="13" text-anchor="middle" fill="#1f5c37">臂六位</text>

  <g stroke="#8a6b3a" stroke-width="1.4" fill="none">
    <path d="M770 158 v8 h64 v-8"/>
  </g>
  <text x="802" y="186" font-size="13" text-anchor="middle" fill="#8a6b3a">夹爪</text>

  <text x="860" y="186" font-size="13" fill="#5a6b7d">4 + 6 + 1 = 11</text>

  <!-- two consumer boxes -->
  <rect x="70" y="208" width="380" height="104" rx="8" fill="#eef4fb" stroke="#9dbcd8"/>
  <text x="88" y="234" font-size="14" font-weight="700" fill="#1f4e79">底盘与运动策略</text>
  <text x="88" y="258" font-size="12.5" fill="#33556f">知道臂存在的强化学习运动策略把速度与俯仰换成腿的命令</text>
  <text x="88" y="278" font-size="12.5" fill="#33556f">控制器只接受瞬时量，不缓存轨迹</text>
  <text x="88" y="298" font-size="12.5" fill="#33556f">两次推理之间俯仰保持，速度清零</text>

  <rect x="474" y="208" width="360" height="104" rx="8" fill="#eef8f1" stroke="#a7cdb4"/>
  <text x="492" y="234" font-size="14" font-weight="700" fill="#1f5c37">臂与夹爪</text>
  <text x="492" y="258" font-size="12.5" fill="#2c5b41">关节轨迹控制器执行绝对关节角</text>
  <text x="492" y="278" font-size="12.5" fill="#2c5b41">十步整块下发，当成一条多点轨迹</text>
  <text x="492" y="298" font-size="12.5" fill="#2c5b41">块内不会被中途换目标打断</text>

  <!-- rate strip -->
  <rect x="70" y="330" width="764" height="52" rx="6" fill="#f5f7fa" stroke="#c7d2de"/>
  <text x="86" y="352" font-size="13" fill="#33475b">策略每 200 ms 出一次计划，一步 200 ms，十步共两秒</text>
  <text x="86" y="372" font-size="13" fill="#33475b">保活线程 50 Hz，十次里有九次没有新计划，只重复俯仰参考</text>

  <text x="70" y="412" font-size="12" fill="#5a6b7d">臂按两秒的轨迹走，底盘每两百毫秒换一次指令。两边的更新率差了十倍，块内的时间尺度不同。</text>
  <text x="70" y="432" font-size="12" fill="#5a6b7d">格子顺序按论文式 (1) 排，下面的分组线是本图按消费端归的。</text>
</svg>
