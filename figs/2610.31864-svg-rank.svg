<svg xmlns="http://www.w3.org/2000/svg" width="800" height="540" viewBox="0 0 800 540" font-family="'Microsoft YaHei','Noto Sans CJK SC','Source Han Sans SC',sans-serif">
  <rect width="800" height="540" fill="#ffffff"/>

  <text x="400" y="34" text-anchor="middle" font-size="19" font-weight="700" fill="#1f2328">瓶颈维数由可观测秩决定，不由状态维数决定</text>
  <text x="400" y="58" text-anchor="middle" font-size="12.5" fill="#57606a">论文第 III-B2 节的维数账本，数值取自 benchmark 车辆模型</text>

  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0,0 L8,4.5 L0,9 z" fill="#8c959f"/>
    </marker>
  </defs>

  <g>
    <rect x="56" y="78" width="392" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="76" y="105" font-size="15" fill="#1f2328">状态未知数　n<tspan font-size="10.5" dy="3">x</tspan><tspan dy="-3"> = 4</tspan></text>
    <text x="76" y="127" font-size="11.5" fill="#57606a">侧偏角、横摆角速度、横摆角、横向偏移</text>
  </g>

  <line x1="252" y1="142" x2="252" y2="170" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="266" y="162" font-size="11.5" fill="#57606a">每路每拍只给 1 个标量观测</text>

  <g>
    <rect x="56" y="172" width="392" height="64" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="76" y="199" font-size="15" fill="#1f2328">独立方程上限　p = 3</text>
    <text x="76" y="221" font-size="11.5" fill="#57606a">3 小于 4，有 1 个方向欠定</text>
  </g>

  <line x1="252" y1="236" x2="252" y2="264" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="266" y="256" font-size="11.5" fill="#57606a">Hermann–Krener 秩条件给上界</text>

  <g>
    <rect x="56" y="266" width="392" height="64" rx="8" fill="#eef4ff" stroke="#84a9f0" stroke-width="1.6"/>
    <text x="76" y="293" font-size="15" fill="#1f2328">可观测秩　rank dG(x) = 3</text>
    <text x="76" y="315" font-size="11.5" fill="#57606a">观测流形维数 n_M 与这个秩相等</text>
  </g>

  <line x1="252" y1="330" x2="252" y2="358" stroke="#8c959f" stroke-width="1.6" marker-end="url(#ar)"/>
  <text x="266" y="350" font-size="11.5" fill="#57606a">瓶颈照这个数设，不照状态维数设</text>

  <g>
    <rect x="56" y="360" width="392" height="64" rx="8" fill="#eef4ff" stroke="#1f6feb" stroke-width="2"/>
    <text x="76" y="387" font-size="15" font-weight="700" fill="#1f2328">锚点瓶颈　n<tspan font-size="10.5" dy="3">z</tspan><tspan dy="-3"> = n</tspan><tspan font-size="10.5" dy="3">M</tspan><tspan dy="-3"> = 3</tspan></text>
    <text x="76" y="409" font-size="11.5" fill="#57606a">实测最大似然内在维数也收敛到 3</text>
  </g>

  <g>
    <rect x="56" y="444" width="392" height="56" rx="8" fill="#ffffff" stroke="#8c959f" stroke-width="1.5" stroke-dasharray="5 4"/>
    <text x="76" y="469" font-size="14" fill="#1f2328">缺口　n<tspan font-size="10" dy="3">x</tspan><tspan dy="-3"> − n</tspan><tspan font-size="10" dy="3">M</tspan><tspan dy="-3"> = 1</tspan></text>
    <text x="76" y="490" font-size="11.5" fill="#57606a">有一个状态方向在可用通道里没有签名，编码器取不回</text>
  </g>

  <g>
    <rect x="492" y="78" width="252" height="88" rx="8" fill="#fff5f5" stroke="#cf222e" stroke-width="1.5"/>
    <text x="512" y="106" font-size="14" font-weight="700" fill="#cf222e">把瓶颈设成 4</text>
    <text x="512" y="128" font-size="11.5" fill="#57606a">跟着状态维数走</text>
    <text x="512" y="148" font-size="11.5" fill="#57606a">多出的那一维取不到新信息</text>
  </g>
  <g>
    <rect x="492" y="180" width="252" height="88" rx="8" fill="#fff5f5" stroke="#cf222e" stroke-width="1.5"/>
    <text x="512" y="208" font-size="14" font-weight="700" fill="#cf222e">把瓶颈设成 2</text>
    <text x="512" y="230" font-size="11.5" fill="#57606a">压得更狠</text>
    <text x="512" y="250" font-size="11.5" fill="#57606a">丢掉本来能用的可观测结构</text>
  </g>
  <g>
    <rect x="492" y="282" width="252" height="122" rx="8" fill="#f6f8fa" stroke="#d0d7de" stroke-width="1.5"/>
    <text x="512" y="308" font-size="13" fill="#1f2328">论文对这一项的原话</text>
    <text x="512" y="332" font-size="11.5" fill="#57606a">这个缺口不是自编码器的缺陷</text>
    <text x="512" y="352" font-size="11.5" fill="#57606a">它量的是状态对这套传感器</text>
    <text x="512" y="372" font-size="11.5" fill="#57606a">有多不可见</text>
    <text x="512" y="392" font-size="10.5" fill="#8c959f">（第 III-B2 节末句）</text>
  </g>

  <text x="56" y="524" font-size="11" fill="#8c959f">蓝框是要照做的三步，红框是两种常见错法，灰虚线框是这一维对不上的来处。</text>
</svg>
