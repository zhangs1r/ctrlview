<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 330" width="920" height="330" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .ttl{fill:#1b1b1f;font-size:15px;font-weight:700}
    .m{fill:#6b6b78;font-size:12px}
    .lab{fill:#3b3b46;font-size:12.5px}
    .b{font-size:12.5px;font-weight:700}
  </style>

  <text class="ttl" x="30" y="30">示意图 B　采集顺序是 L、M、H、M 的来回，不是从暗到亮扫一遍</text>

  <!-- 纵轴 -->
  <line x1="105" y1="215" x2="105" y2="62" stroke="#ddd9d2" stroke-width="1.5"/>
  <text class="m" x="88" y="70" text-anchor="end">High</text>
  <text class="m" x="88" y="134" text-anchor="end">Mid</text>
  <text class="m" x="88" y="198" text-anchor="end">Low</text>
  <text class="lab" x="60" y="200" transform="rotate(-90 60 200)">曝光档（对数 EV 值，向上曝光更长）</text>

  <!-- 连接路径 -->
  <polyline fill="none" stroke="#b9b3a8" stroke-width="1.8"
    points="150,182 240,134 330,84 420,134 510,182 600,134 690,84 780,134"/>

  <!-- 帧方块 -->
  <g>
    <rect x="119" y="168" width="62" height="28" rx="6" fill="#d9e5f0" stroke="#3f6fa8" stroke-width="2"/>
    <text class="b" x="150" y="187" text-anchor="middle" fill="#2d5f8a">Low</text>

    <rect x="209" y="120" width="62" height="28" rx="6" fill="#d8ece5" stroke="#2f7d68" stroke-width="2"/>
    <text class="b" x="240" y="139" text-anchor="middle" fill="#25634f">Mid</text>

    <rect x="299" y="70" width="62" height="28" rx="6" fill="#f6e7c8" stroke="#c08a2a" stroke-width="2"/>
    <text class="b" x="330" y="89" text-anchor="middle" fill="#9a6a14">High</text>

    <rect x="389" y="120" width="62" height="28" rx="6" fill="#d8ece5" stroke="#2f7d68" stroke-width="2"/>
    <text class="b" x="420" y="139" text-anchor="middle" fill="#25634f">Mid</text>

    <rect x="479" y="168" width="62" height="28" rx="6" fill="#d9e5f0" stroke="#3f6fa8" stroke-width="2"/>
    <text class="b" x="510" y="187" text-anchor="middle" fill="#2d5f8a">Low</text>

    <rect x="569" y="120" width="62" height="28" rx="6" fill="#d8ece5" stroke="#2f7d68" stroke-width="2"/>
    <text class="b" x="600" y="139" text-anchor="middle" fill="#25634f">Mid</text>

    <rect x="659" y="70" width="62" height="28" rx="6" fill="#f6e7c8" stroke="#c08a2a" stroke-width="2"/>
    <text class="b" x="690" y="89" text-anchor="middle" fill="#9a6a14">High</text>

    <rect x="749" y="120" width="62" height="28" rx="6" fill="#d8ece5" stroke="#2f7d68" stroke-width="2"/>
    <text class="b" x="780" y="139" text-anchor="middle" fill="#25634f">Mid</text>
  </g>

  <!-- 周期分界 -->
  <line x1="465" y1="58" x2="465" y2="222" stroke="#8a5a2d" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text class="m" x="465" y="52" text-anchor="middle">周期边界（4 帧）</text>

  <!-- 横轴 -->
  <line x1="105" y1="215" x2="860" y2="215" stroke="#ddd9d2" stroke-width="1.5"/>
  <text class="m" x="150" y="232" text-anchor="middle">i</text>
  <text class="m" x="240" y="232" text-anchor="middle">i+1</text>
  <text class="m" x="330" y="232" text-anchor="middle">i+2</text>
  <text class="m" x="420" y="232" text-anchor="middle">i+3</text>
  <text class="m" x="510" y="232" text-anchor="middle">i+4</text>
  <text class="m" x="600" y="232" text-anchor="middle">i+5</text>
  <text class="m" x="690" y="232" text-anchor="middle">i+6</text>
  <text class="m" x="780" y="232" text-anchor="middle">i+7</text>
  <text class="m" x="850" y="252" text-anchor="end">帧序号（采集先后）</text>

  <!-- 说明 -->
  <line x1="215" y1="252" x2="265" y2="252" stroke="#8a5a2d" stroke-width="1.4"/>
  <text class="lab" x="272" y="256">相邻两帧只差一档曝光，这是跨帧匹配能成立的前提</text>
  <text class="lab" x="215" y="284">Low 与 High 之间总隔着一个 Mid，两者从不相邻采集</text>
  <text class="m" x="215" y="306">Mid 的位置由式 3 在 Low 与 High 之间等分，最小间隔由式 4 兜住；n 取 3 时一个周期是 2n−2 帧，即 4 帧</text>
</svg>
