<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 580 540" width="580" height="540" font-family="system-ui, -apple-system, 'Segoe UI', 'Microsoft YaHei', sans-serif">
  <rect width="580" height="540" fill="#ffffff"/>

  <text x="90" y="28" font-size="15" font-weight="600" fill="#1f3552">一个全局注意力层的激活有多大</text>

  <!-- gridlines -->
  <g stroke="#e6ecf2" stroke-width="1">
    <line x1="90" y1="425.3" x2="490" y2="425.3"/>
    <line x1="90" y1="337.2" x2="490" y2="337.2"/>
    <line x1="90" y1="248.9" x2="490" y2="248.9"/>
    <line x1="90" y1="160.9" x2="490" y2="160.9"/>
    <line x1="90" y1="72.7" x2="490" y2="72.7"/>
  </g>
  <g font-size="11" fill="#8496a8" text-anchor="end">
    <text x="84" y="429">32</text>
    <text x="84" y="341">128</text>
    <text x="84" y="253">512</text>
    <text x="84" y="165">2048</text>
    <text x="84" y="77">8192</text>
  </g>
  <text x="84" y="456" font-size="11" fill="#8496a8" text-anchor="end">MiB</text>

  <!-- axes -->
  <line x1="90" y1="60" x2="90" y2="470" stroke="#9aa9b8" stroke-width="1.4"/>
  <line x1="90" y1="470" x2="500" y2="470" stroke="#9aa9b8" stroke-width="1.4"/>
  <g font-size="11.5" fill="#5d7590" text-anchor="middle">
    <text x="90" y="490">512</text>
    <text x="201" y="490">768</text>
    <text x="280" y="490">1024</text>
    <text x="391" y="490">1536</text>
    <text x="470" y="490">2048</text>
  </g>
  <text x="300" y="512" font-size="12" fill="#5d7590" text-anchor="middle">输入边长 S（像素）</text>

  <!-- ViT-L / ViT-H : 16 heads -->
  <polyline points="90,425.3 201,321.7 280,248.9 391,145.6 470,72.7"
            fill="none" stroke="#c98a3c" stroke-width="2" stroke-dasharray="6 4"/>
  <g fill="#c98a3c">
    <circle cx="90" cy="425.3" r="4"/>
    <circle cx="201" cy="321.7" r="4"/>
    <circle cx="280" cy="248.9" r="4"/>
    <circle cx="391" cy="145.6" r="4"/>
    <circle cx="470" cy="72.7" r="4"/>
  </g>

  <!-- ViT-B : 12 heads -->
  <polyline points="90,443.6 201,340.2 280,267.4 391,164.0 470,91.0"
            fill="none" stroke="#2f6fa8" stroke-width="2.4"/>
  <g fill="#2f6fa8">
    <circle cx="90" cy="443.6" r="4.5"/>
    <circle cx="201" cy="340.2" r="4.5"/>
    <circle cx="280" cy="267.4" r="5.5"/>
    <circle cx="391" cy="164.0" r="4.5"/>
    <circle cx="470" cy="91.0" r="4.5"/>
  </g>

  <!-- callouts at S=1024 -->
  <text x="320" y="238" font-size="12" fill="#c98a3c">512 MiB（ViT-L 与 ViT-H）</text>
  <text x="320" y="256" font-size="12" fill="#2f6fa8">384 MiB（ViT-B）</text>

  <!-- precision halving arrow -->
  <path d="M286 276 L286 303" stroke="#8496a8" stroke-width="1.6"/>
  <path d="M286 309 L281 300 L291 300 Z" fill="#8496a8"/>
  <text x="296" y="300" font-size="11.5" fill="#6d8298">精度减半，只到 192 MiB</text>

  <!-- resolution halving arrow -->
  <path d="M272 280 L140 400" fill="none" stroke="#8496a8" stroke-width="1.4" stroke-dasharray="4 3"/>
  <text x="128" y="440" font-size="11.5" fill="#6d8298">S 减半，缩到十六分之一</text>

  <!-- legend -->
  <rect x="320" y="356" width="176" height="56" rx="8" fill="#fbfcfe" stroke="#dde5ee"/>
  <line x1="332" y1="376" x2="364" y2="376" stroke="#2f6fa8" stroke-width="2.4"/>
  <text x="372" y="380" font-size="11.5" fill="#3c5570">ViT-B，12 个头</text>
  <line x1="332" y1="397" x2="364" y2="397" stroke="#c98a3c" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="372" y="401" font-size="11.5" fill="#3c5570">ViT-L 与 ViT-H，16 个头</text>

  <text x="90" y="534" font-size="10.5" fill="#93a3b3">纵轴取对数。元素数按 H × N² 算，N 等于 S/16 的平方，每元素 2 字节（FP16）。</text>
</svg>
