<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 400" width="780" height="400" font-family="Helvetica, Arial, sans-serif">
  <rect x="0" y="0" width="780" height="400" fill="#ffffff"/>

  <!-- ================= left panel ================= -->
  <text x="60" y="34" font-size="15" fill="#2d3748" font-weight="bold">回流前，整条路径是弯的</text>

  <!-- axes -->
  <line x1="70" y1="310" x2="360" y2="310" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="70" y1="310" x2="70" y2="90" stroke="#4a5568" stroke-width="1.4"/>
  <text x="300" y="332" font-size="12" fill="#4a5568">流时间 t</text>
  <text x="26" y="96" font-size="12" fill="#4a5568">动作分量</text>
  <text x="76" y="332" font-size="12" fill="#4a5568">1</text>
  <text x="342" y="332" font-size="12" fill="#4a5568">0</text>

  <!-- reference (learned) path: curved -->
  <path d="M92,120 C150,150 210,240 340,268" fill="none" stroke="#a0aec0" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="150" y="118" font-size="12" fill="#718096">真实路径（当前速度场）</text>

  <!-- 64-step euler polyline approximating the curve -->
  <polyline points="92,120 108,121 124,123 140,126 156,131 172,137 188,145 203,154 217,164 230,175 243,187 255,199 267,211 278,223 289,234 300,244 311,252 322,259 332,264 340,268"
            fill="none" stroke="#2b6cb0" stroke-width="2.2"/>
  <circle cx="92" cy="120" r="4" fill="#2b6cb0"/>
  <circle cx="340" cy="268" r="4" fill="#2b6cb0"/>

  <!-- 1-step euler chord, teal -->
  <line x1="92" y1="120" x2="340" y2="268" stroke="#2f855a" stroke-width="2.2" stroke-dasharray="7 4"/>
  <circle cx="340" cy="268" r="4" fill="#2f855a"/>

  <!-- gap annotation -->
  <path d="M340,268 L340,214" stroke="#c53030" stroke-width="1.4" stroke-dasharray="3 3"/>
  <path d="M334,214 L346,214" stroke="#c53030" stroke-width="1.4"/>
  <text x="348" y="190" font-size="12" fill="#c53030">两个落点差出来的那一段</text>
  <text x="348" y="208" font-size="12" fill="#c53030">就是粗积分的误差</text>

  <text x="96" y="288" font-size="12" fill="#2b6cb0">64 步折线，贴合曲线</text>
  <text x="96" y="176" font-size="12" fill="#2f855a">1 步直线</text>

  <!-- ================= right panel ================= -->
  <text x="440" y="34" font-size="15" fill="#2d3748" font-weight="bold">回流后，路径被拉直</text>

  <line x1="450" y1="310" x2="740" y2="310" stroke="#4a5568" stroke-width="1.4"/>
  <line x1="450" y1="310" x2="450" y2="90" stroke="#4a5568" stroke-width="1.4"/>
  <text x="680" y="332" font-size="12" fill="#4a5568">流时间 t</text>
  <text x="406" y="96" font-size="12" fill="#4a5568">动作分量</text>
  <text x="456" y="332" font-size="12" fill="#4a5568">1</text>
  <text x="722" y="332" font-size="12" fill="#4a5568">0</text>

  <!-- rectified path: nearly straight -->
  <line x1="472" y1="130" x2="720" y2="288" stroke="#2b6cb0" stroke-width="2.2"/>
  <line x1="472" y1="130" x2="720" y2="288" stroke="#2f855a" stroke-width="3.4" stroke-dasharray="7 4" opacity="0.85"/>
  <circle cx="472" cy="130" r="4" fill="#2b6cb0"/>
  <circle cx="720" cy="288" r="5" fill="#2f855a"/>

  <text x="500" y="152" font-size="12" fill="#2b6cb0">整步路径已经接近直线</text>
  <text x="500" y="170" font-size="12" fill="#2f855a">1 步与 64 步落在同一处</text>
  <text x="500" y="286" font-size="12" fill="#718096">曲线弯折被放大绘制，只表示关系，不表示幅度</text>

  <!-- central arrow -->
  <line x1="376" y1="200" x2="428" y2="200" stroke="#4a5568" stroke-width="2"/>
  <polygon points="428,194 442,200 428,206" fill="#4a5568"/>
  <text x="368" y="184" font-size="12" fill="#4a5568">在线回流</text>

  <rect x="40" y="356" width="700" height="30" rx="6" fill="#f7fafc" stroke="#e2e8f0"/>
  <text x="52" y="376" font-size="12" fill="#4a5568">横轴是流时间 t，从 1（噪声端）到 0（动作端），纵轴是任意一维动作分量的取值。两条路径都取自论文正文对欧拉积分与回流的描述。</text>
</svg>
