<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 430" width="920" height="430" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .h{font-size:14.5px;font-weight:700}
    .s{font-size:12.5px;fill:#6b6b78}
    .m{font-size:12px;fill:#6b6b78}
    .cp{font-size:12.5px;fill:#1b1b1f;font-weight:600}
    .bad{fill:#b85028}
    .good{fill:#3f7d55}
  </style>

  <!-- 左：错的 -->
  <rect x="30" y="50" width="420" height="360" rx="10" fill="#fdfaf9" stroke="#e6e4df" stroke-width="1.5"/>
  <text class="h bad" x="52" y="82">✗ 对整个窗口做相似变换</text>
  <text class="s" x="52" y="104">把缩放加到整段窗口上</text>

  <text class="m" x="52" y="152">原始米制基线</text>
  <line x1="100" y1="190" x2="300" y2="190" stroke="#2d5f8a" stroke-width="2.5"/>
  <circle cx="100" cy="190" r="9" fill="#2d5f8a"/>
  <circle cx="200" cy="190" r="9" fill="#2d5f8a"/>
  <circle cx="300" cy="190" r="9" fill="#2d5f8a"/>
  <text class="cp" x="100" y="214" text-anchor="middle">C₁</text>
  <text class="cp" x="200" y="214" text-anchor="middle">C₂</text>
  <text class="cp" x="300" y="214" text-anchor="middle">C₃</text>
  <text class="m" x="200" y="176" text-anchor="middle">基线 d</text>

  <text class="m" x="52" y="276">相似变换之后</text>
  <line x1="100" y1="316" x2="400" y2="316" stroke="#b85028" stroke-width="2.5" stroke-dasharray="7 5"/>
  <circle cx="100" cy="316" r="9" fill="none" stroke="#b85028" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="250" cy="316" r="9" fill="none" stroke="#b85028" stroke-width="2.5" stroke-dasharray="4 3"/>
  <circle cx="400" cy="316" r="9" fill="none" stroke="#b85028" stroke-width="2.5" stroke-dasharray="4 3"/>
  <text class="cp" x="100" y="342" text-anchor="middle">C₁′</text>
  <text class="cp" x="250" y="342" text-anchor="middle">C₂′</text>
  <text class="cp" x="400" y="342" text-anchor="middle">C₃′</text>
  <text class="m" x="250" y="300" text-anchor="middle">基线被拉成 1.5d</text>

  <text class="bad" x="52" y="376" font-size="13.5" font-weight="700">基线和相机位置一起被改掉</text>
  <text class="m" x="52" y="396">原本站得对的非中心帧，全被推歪</text>

  <!-- 右：对的 -->
  <rect x="470" y="50" width="420" height="360" rx="10" fill="#f8fbf9" stroke="#e6e4df" stroke-width="1.5"/>
  <text class="h good" x="492" y="82">✓ 只把缩放加在深度上</text>
  <text class="s" x="492" y="104">相机位置保持滤波器给出的米制值</text>

  <text class="m" x="492" y="152">放大尺度后，点沿原视线后移</text>

  <line x1="540" y1="250" x2="740" y2="250" stroke="#2d5f8a" stroke-width="2.5"/>
  <line x1="640" y1="250" x2="830" y2="120" stroke="#9dbcd4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <circle cx="540" cy="250" r="9" fill="#2d5f8a"/>
  <circle cx="640" cy="250" r="9" fill="#2d5f8a"/>
  <circle cx="740" cy="250" r="9" fill="#2d5f8a"/>
  <text class="cp" x="540" y="274" text-anchor="middle">C₁</text>
  <text class="cp" x="640" y="274" text-anchor="middle">C₂</text>
  <text class="cp" x="740" y="274" text-anchor="middle">C₃</text>
  <text class="m" x="640" y="298" text-anchor="middle">基线保持 d</text>

  <circle cx="716" cy="198" r="6" fill="#8a5a2d"/>
  <text class="cp" x="700" y="192" text-anchor="end">P</text>
  <circle cx="783" cy="153" r="6" fill="none" stroke="#8a5a2d" stroke-width="2.5"/>
  <text class="cp" x="797" y="148">P′</text>
  <path d="M726,193 L773,160" stroke="#8a5a2d" stroke-width="1.8" fill="none" marker-end="url(#ah2)"/>
  <defs>
    <marker id="ah2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#8a5a2d"/>
    </marker>
  </defs>

  <text class="good" x="492" y="376" font-size="13.5" font-weight="700">相机不动，只有深度被缩放</text>
  <text class="m" x="492" y="396">窗口内的米制基线因此保住，整体尺度交给图去估</text>
</svg>
