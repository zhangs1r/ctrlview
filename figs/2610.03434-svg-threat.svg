<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 470" width="940" height="470" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .tb{fill:#1b1b1f;font-size:15px;font-weight:700}
    .hd{fill:#1b1b1f;font-size:13.5px;font-weight:650}
    .sm{fill:#6b6b78;font-size:12px}
    .cap{fill:#3c3c46;font-size:12.5px}
    .blk{fill:#eceef2;stroke:#9a9ea8;stroke-width:1.5}
    .gate{fill:#cfe0f0;stroke:#5f8db5;stroke-width:1.8}
    .agent{fill:#f7e2ce;stroke:#c99a63;stroke-width:1.6}
    .raw{fill:#f7dcdc;stroke:#c07a7a;stroke-width:1.5}
    .line{stroke:#6b6b78;stroke-width:1.6;fill:none}
    .arr{stroke:#6b6b78;stroke-width:1.6;fill:none;marker-end:url(#ah)}
  </style>
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#6b6b78"/>
    </marker>
  </defs>

  <text class="tb" x="30" y="30">攻击者能碰到的东西，停在最外面那圈</text>
  <text class="sm" x="30" y="52">灰色虚线以里是论文假定攻击者碰不到的部分，输入守卫和输出守卫是仅有的两道检查点。</text>

  <!-- attacker -->
  <rect class="raw" x="34" y="106" width="150" height="112" rx="10"/>
  <text class="hd" x="56" y="136">外部恶意用户</text>
  <text class="sm" x="56" y="160">可以无限次提问</text>
  <text class="sm" x="56" y="180">能读回全部回复</text>
  <text class="sm" x="56" y="200">知道这个 agent 是干什么的</text>

  <!-- trust boundary -->
  <rect x="228" y="88" width="662" height="322" rx="14" fill="#fbfbfc" stroke="#9a9ea8" stroke-width="1.6" stroke-dasharray="6 5"/>
  <text class="sm" x="246" y="112">企业内部，攻击者进不来</text>

  <!-- gate in -->
  <rect class="gate" x="256" y="146" width="132" height="92" rx="10"/>
  <text class="hd" x="272" y="176">输入守卫</text>
  <text class="sm" x="272" y="198">看这一轮提问</text>
  <text class="sm" x="272" y="218">同步挡在 agent 之前</text>

  <!-- agent -->
  <rect class="agent" x="440" y="132" width="200" height="120" rx="10"/>
  <text class="hd" x="460" y="162">agent 执行</text>
  <text class="sm" x="460" y="186">多步推理</text>
  <text class="sm" x="460" y="206">调工具、查知识库</text>
  <text class="sm" x="460" y="226">中间动作守卫看不见</text>

  <!-- inside stores -->
  <rect class="blk" x="676" y="140" width="192" height="46" rx="8"/>
  <text class="sm" x="694" y="168">系统提示、记忆、编排逻辑</text>
  <rect class="blk" x="676" y="198" width="192" height="46" rx="8"/>
  <text class="sm" x="694" y="226">内部工具、检索库、执行环境</text>

  <!-- gate out -->
  <rect class="gate" x="440" y="300" width="200" height="88" rx="10"/>
  <text class="hd" x="460" y="330">输出守卫</text>
  <text class="sm" x="460" y="352">看准备交给用户的</text>
  <text class="sm" x="460" y="372">这是最后一道拦截点</text>

  <path class="arr" d="M 184 162 L 250 162"/>
  <path class="arr" d="M 388 192 L 434 192"/>
  <path class="arr" d="M 640 192 L 670 165"/>
  <path class="arr" d="M 560 252 L 560 294"/>
  <path class="arr" d="M 440 344 L 200 344 L 200 224"/>
  <text class="sm" x="212" y="366">放行或拒绝</text>

  <rect x="34" y="424" width="872" height="34" rx="8" fill="#faf9f7" stroke="#ddd9d2" stroke-width="1.5"/>
  <text class="sm" x="54" y="446">间接注入、工具投毒、记忆投毒都在这圈里面，所以论文把它们写在评测范围之外。</text>
</svg>
