<text x="484.0" y="414.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">xₑ  单位 m</text>
<text x="130.0" y="88.0" font-size="12" fill="#1f2328" text-anchor="end" font-weight="normal">yₑ</text>
<text x="152.0" y="134.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">转心</text>
<text x="126.0" y="300" font-size="12.5" fill="#1f2328" text-anchor="end" font-weight="normal">R = v / ω</text>
<text x="180.0" y="418.0" font-size="12" fill="#8b949e" text-anchor="start" font-weight="normal">若当成沿 x 直走 v·Δt</text>
