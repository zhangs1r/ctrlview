<text x="166.0" y="304.0" font-size="12" fill="#1f2328" text-anchor="start" font-weight="bold">ωΔt</text>
<rect x="424" y="56" width="328" height="128" rx="6" fill="#f6f8fa" stroke="#d0d7de"/>
<text x="438" y="82" font-size="13" fill="#1f2328" text-anchor="start" font-weight="bold">一步位移的解析式</text>
<text x="438" y="110" font-size="12.5" fill="#1f6feb" text-anchor="start" font-weight="normal">Δp = (v/ω) · [ sin(ωΔt),  1 − cos(ωΔt) ]</text>
<text x="438" y="136" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">弦长 = 2R·sin(ωΔt/2) ≤ 弧长 = R·ωΔt</text>
<text x="438" y="160" font-size="12" fill="#1f2328" text-anchor="start" font-weight="normal">ω → 0 时退化为 [ vΔt, 0 ]</text>
<text x="438" y="178" font-size="11.5" fill="#8b949e" text-anchor="start" font-weight="normal">两轮速度差给出的是弦，不是切线长度</text>
