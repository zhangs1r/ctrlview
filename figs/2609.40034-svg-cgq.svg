<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" font-family="'Microsoft YaHei','Noto Sans CJK SC',sans-serif">
  <rect x="0" y="0" width="900" height="560" fill="#ffffff"/>

  <text x="450" y="34" font-size="19" font-weight="bold" text-anchor="middle" fill="#1b1f24">一次跨组查询的构造与它返回什么</text>

  <rect x="330" y="60" width="240" height="54" rx="8" fill="#eef2f7" stroke="#8b98a8" stroke-width="1.4"/>
  <text x="450" y="83" font-size="14" text-anchor="middle" fill="#1b1f24">未标注样本池 Q</text>
  <text x="450" y="103" font-size="13" text-anchor="middle" fill="#4b5563">有输入,没有标签</text>

  <line x1="450" y1="114" x2="450" y2="140" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="130" y1="140" x2="770" y2="140" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="130" y1="140" x2="130" y2="160" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="343" y1="140" x2="343" y2="160" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="557" y1="140" x2="557" y2="160" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="770" y1="140" x2="770" y2="160" stroke="#8b98a8" stroke-width="1.4"/>

  <rect x="80" y="160" width="100" height="70" rx="6" fill="#fdecea" stroke="#d98b82" stroke-width="1.4"/>
  <text x="130" y="188" font-size="13" text-anchor="middle" fill="#1b1f24">Z₁ 组</text>
  <text x="130" y="210" font-size="12" text-anchor="middle" fill="#4b5563">保护属性 = 1</text>

  <rect x="293" y="160" width="100" height="70" rx="6" fill="#eaf6ec" stroke="#82b98c" stroke-width="1.4"/>
  <text x="343" y="188" font-size="13" text-anchor="middle" fill="#1b1f24">Z₂ 组</text>
  <text x="343" y="210" font-size="12" text-anchor="middle" fill="#4b5563">保护属性 = 2</text>

  <rect x="507" y="160" width="100" height="70" rx="6" fill="#eaf1fb" stroke="#82a1d9" stroke-width="1.4"/>
  <text x="557" y="188" font-size="13" text-anchor="middle" fill="#1b1f24">Z₃ 组</text>
  <text x="557" y="210" font-size="12" text-anchor="middle" fill="#4b5563">保护属性 = 3</text>

  <rect x="720" y="160" width="100" height="70" rx="6" fill="#fdf6e6" stroke="#d9b56b" stroke-width="1.4"/>
  <text x="770" y="188" font-size="13" text-anchor="middle" fill="#1b1f24">Z_k 组</text>
  <text x="770" y="210" font-size="12" text-anchor="middle" fill="#4b5563">保护属性 = k</text>

  <line x1="130" y1="230" x2="130" y2="266" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="343" y1="230" x2="343" y2="266" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="557" y1="230" x2="557" y2="266" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="770" y1="230" x2="770" y2="266" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="130" y1="266" x2="770" y2="266" stroke="#8b98a8" stroke-width="1.4"/>
  <line x1="450" y1="266" x2="450" y2="290" stroke="#8b98a8" stroke-width="1.4"/>

  <circle cx="130" cy="252" r="3" fill="#d98b82"/>
  <circle cx="343" cy="252" r="3" fill="#82b98c"/>
  <circle cx="557" cy="252" r="3" fill="#82a1d9"/>
  <circle cx="770" cy="252" r="3" fill="#d9b56b"/>
  <text x="450" y="258" font-size="12" text-anchor="middle" fill="#4b5563">每组抽一个样本</text>

  <rect x="300" y="290" width="300" height="66" rx="8" fill="#f4f1fb" stroke="#9a8fc4" stroke-width="1.6"/>
  <text x="450" y="314" font-size="14" text-anchor="middle" fill="#1b1f24">跨组查询 X = (x₁, x₂, …, x_k)</text>
  <text x="450" y="338" font-size="12.5" text-anchor="middle" fill="#4b5563">每个分量来自各自那一组,组合方式在交互前定好</text>

  <line x1="600" y1="323" x2="700" y2="323" stroke="#9a8fc4" stroke-width="1.6" marker-end="url(#ar)"/>
  <defs>
    <marker id="ar" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#9a8fc4"/>
    </marker>
    <marker id="ar2" markerWidth="9" markerHeight="9" refX="7" refY="3" orient="auto">
      <path d="M0,0 L7,3 L0,6 z" fill="#c0796f"/>
    </marker>
  </defs>

  <rect x="700" y="288" width="170" height="70" rx="8" fill="#eef2f7" stroke="#5b6b7d" stroke-width="1.6"/>
  <text x="785" y="312" font-size="13.5" text-anchor="middle" fill="#1b1f24">模型所有者 M</text>
  <text x="785" y="334" font-size="12" text-anchor="middle" fill="#4b5563">部署中的模型 h</text>

  <line x1="700" y1="392" x2="600" y2="392" stroke="#c0796f" stroke-width="1.6" marker-end="url(#ar2)"/>
  <text x="650" y="384" font-size="12.5" text-anchor="middle" fill="#8a4a42">只回关系差</text>

  <rect x="250" y="410" width="350" height="58" rx="8" fill="#fdf1ef" stroke="#c0796f" stroke-width="1.6"/>
  <text x="425" y="434" font-size="13.5" text-anchor="middle" fill="#1b1f24">响应 = ( h(x_i) − h(x_j) )，i &lt; j</text>
  <text x="425" y="455" font-size="12" text-anchor="middle" fill="#4b5563">k 组两两配对,共 C(k,2) 个数</text>

  <line x1="425" y1="468" x2="425" y2="492" stroke="#8b98a8" stroke-width="1.4"/>
  <rect x="300" y="492" width="250" height="46" rx="8" fill="#f2f4f6" stroke="#8b98a8" stroke-width="1.4"/>
  <text x="425" y="521" font-size="13" text-anchor="middle" fill="#1b1f24">看不到 h(x₁) 这类绝对预测</text>

  <text x="450" y="556" font-size="11.5" text-anchor="middle" fill="#6b7280">编者绘制</text>
</svg>
