<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 400" width="980" height="400" font-family="system-ui,-apple-system,'Segoe UI','Microsoft YaHei',sans-serif">
  <style>
    .tb{fill:#1b1b1f;font-size:16px;font-weight:700}
    .row{font-size:13.5px;font-weight:650;fill:#1b1b1f}
    .seg{font-size:12.5px;font-weight:650}
    .tot{font-size:14px;font-weight:700;fill:#1b1b1f}
    .ax{font-size:12px;fill:#6b6b78}
    .m{font-size:12.5px;fill:#4a4a55}
    .fix{fill:#e4e2dd;stroke:#b4b0a8;stroke-width:1.4}
    .stp{fill:#e6f2e8;stroke:#8fbd9c;stroke-width:1.4}
    .axis{stroke:#8d8d99;stroke-width:1.4}
  </style>

  <text class="tb" x="34" y="34">一次模型推理的时间花在哪（编者据表 5 与表 7 反算）</text>

  <text class="row" x="30" y="131">标准 10 步</text>
  <rect class="fix" x="150" y="110" width="133" height="34" rx="4"/>
  <rect class="stp" x="283" y="110" width="545" height="34" rx="4"/>
  <text class="seg" x="216" y="132" text-anchor="middle" fill="#57534c">固定 12.06</text>
  <text class="seg" x="490" y="132" text-anchor="middle" fill="#31603f">10 次专家求值 × 4.95</text>
  <text class="tot" x="845" y="132">61.56 ms</text>

  <text class="row" x="30" y="191">Legato 5 步</text>
  <rect class="fix" x="150" y="170" width="133" height="34" rx="4"/>
  <rect class="stp" x="283" y="170" width="272" height="34" rx="4"/>
  <text class="seg" x="216" y="192" text-anchor="middle" fill="#57534c">固定 12.06</text>
  <text class="seg" x="419" y="192" text-anchor="middle" fill="#31603f">5 × 4.95</text>
  <text class="tot" x="845" y="192">36.81 ms</text>

  <text class="row" x="30" y="251">两阶段 2 步</text>
  <rect class="fix" x="150" y="230" width="133" height="34" rx="4"/>
  <rect class="stp" x="283" y="230" width="109" height="34" rx="4"/>
  <text class="seg" x="216" y="252" text-anchor="middle" fill="#57534c">固定 12.06</text>
  <text class="seg" x="378" y="252" fill="#31603f">2 × 4.95</text>
  <text class="tot" x="845" y="252">21.96 ms</text>

  <line class="axis" x1="150" y1="288" x2="838" y2="288"/>
  <g class="ax" text-anchor="middle">
    <text x="150" y="306">0</text>
    <text x="260" y="306">10</text>
    <text x="370" y="306">20</text>
    <text x="480" y="306">30</text>
    <text x="590" y="306">40</text>
    <text x="700" y="306">50</text>
    <text x="810" y="306">60</text>
  </g>
  <text class="ax" x="838" y="306">毫秒</text>

  <rect x="34" y="322" width="912" height="62" rx="10" fill="#faf9f7" stroke="#ddd9d2" stroke-width="1.5"/>
  <text class="m" x="54" y="348">灰段是与步数无关的固定部分，条件编码、输入预处理和输出后处理都在这里。绿段是每多一步就多一次的专家前向。</text>
  <text class="m" x="54" y="372">三组实测值落在同一条直线上，斜率 4.95 毫秒每步，截距 12.06 毫秒，拟合偏差不到 0.01 毫秒。</text>
</svg>
