<svg xmlns="http://www.w3.org/2000/svg" width="980" height="560" viewBox="0 0 980 560" font-family="Segoe UI, Helvetica Neue, Arial, sans-serif">
  <rect x="0" y="0" width="980" height="560" fill="#ffffff"/>

  <text x="24" y="36" font-size="20" font-weight="700" fill="#1b2a41">两个阶段里，随 k 变化的东西不一样</text>
  <text x="24" y="60" font-size="13" fill="#5a6b7d">横轴是时间 k。每一列是一个时刻的量化格子，格子宽度是当时的量化误差界，整块高度是当时的量化范围。</text>

  <!-- phase bands -->
  <rect x="90" y="80" width="420" height="300" rx="8" fill="#eef4fb" stroke="#9dbcd8"/>
  <rect x="530" y="80" width="420" height="300" rx="8" fill="#eef8f1" stroke="#a7cdb4"/>
  <text x="110" y="106" font-size="15" font-weight="700" fill="#1f4e79">控制器设计阶段　k = 0 … T</text>
  <text x="550" y="106" font-size="15" font-weight="700" fill="#1f5c37">镇定阶段　k ≥ T+1</text>

  <!-- stage 1: growing range, varying cell count, fixed delta -->
  <g stroke="#1f4e79" fill="#dce9f7" stroke-width="1.2">
    <rect x="120" y="330" width="36" height="20"/>
    <rect x="184" y="316" width="36" height="34"/>
    <rect x="248" y="296" width="36" height="54"/>
    <rect x="312" y="322" width="36" height="28"/>
    <rect x="376" y="278" width="36" height="72"/>
    <rect x="440" y="252" width="36" height="98"/>
  </g>
  <g stroke="#1f4e79" stroke-width="1" stroke-dasharray="4 3">
    <line x1="150" y1="130" x2="150" y2="350"/>
    <line x1="214" y1="130" x2="214" y2="350"/>
    <line x1="278" y1="130" x2="278" y2="350"/>
    <line x1="342" y1="130" x2="342" y2="350"/>
    <line x1="406" y1="130" x2="406" y2="350"/>
  </g>
  <text x="128" y="372" font-size="12" fill="#33556f">E₀</text>
  <text x="256" y="372" font-size="12" fill="#33556f">E₂</text>
  <text x="448" y="372" font-size="12" fill="#33556f">E(T)</text>

  <line x1="120" y1="420" x2="480" y2="420" stroke="#33556f" stroke-width="1.5"/>
  <text x="300" y="440" font-size="13" text-anchor="middle" fill="#33556f">量化误差界固定为 δ，格子数 Nₖ 随范围变大而变</text>
  <text x="300" y="460" font-size="13" text-anchor="middle" fill="#33556f">每列都给出同一个 δ 保证</text>

  <!-- stage 2: fixed cell count, shrinking range, thinning cell width -->
  <g stroke="#1f5c37" fill="#dff1e5" stroke-width="1.2">
    <rect x="560" y="250" width="42" height="100"/>
    <rect x="628" y="266" width="40" height="68"/>
    <rect x="694" y="280" width="38" height="46"/>
    <rect x="758" y="292" width="36" height="31"/>
    <rect x="820" y="302" width="34" height="21"/>
    <rect x="880" y="308" width="32" height="14"/>
  </g>
  <line x1="552" y1="350" x2="920" y2="350" stroke="#1f5c37" stroke-width="1.5"/>
  <line x1="552" y1="130" x2="552" y2="350" stroke="#1f5c37" stroke-width="1.5"/>
  <text x="524" y="244" font-size="12" fill="#1f5c37" text-anchor="end">E(T+1)</text>
  <text x="928" y="398" font-size="12" fill="#1f5c37" text-anchor="end">范围每步乘 μ，格子数不变</text>

  <text x="740" y="440" font-size="13" text-anchor="middle" fill="#1f5c37">格子数固定为 Nₛ，范围按 μ 指数收缩</text>
  <text x="740" y="460" font-size="13" text-anchor="middle" fill="#1f5c37">格子宽度跟着缩，精度自动变细</text>

  <!-- handoff marker -->
  <line x1="510" y1="96" x2="510" y2="400" stroke="#b3372f" stroke-width="2" stroke-dasharray="6 4"/>
  <text x="510" y="492" font-size="13" text-anchor="middle" fill="#b3372f">交接在 T 与 T+1 之间　u(T) = 0，反馈从 T+1 起</text>

  <!-- channel row -->
  <rect x="90" y="508" width="860" height="34" rx="6" fill="#f5f7fa" stroke="#c7d2de"/>
  <text x="104" y="530" font-size="13" fill="#33475b">回传内容只有量化格子编号，Eₖ 与 Nₖ 两端都能按更新规则复算，不必单独传</text>
</svg>
