<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 640" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="980" height="640" fill="#ffffff"/>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4f5f72"/>
    </marker>
  </defs>

  <text x="30" y="40" font-size="21" font-weight="700" fill="#1a2433">单层路由能读到多少隐藏状态</text>
  <text x="30" y="66" font-size="13" fill="#5a6675">数值取自论文附录 E.1 对 OLMoE-1B-7B 的说明，隐蔽维度 d = 2048，专家个数 E = 64。论文未给出该模型的 MoE 层数。</text>

  <!-- Panel 1: forward pass -->
  <text x="30" y="108" font-size="14" font-weight="700" fill="#1a2433">① 前向，路由把 d 维压成 E 维打分</text>

  <rect x="40" y="126" width="120" height="150" rx="8" fill="#dfe9f5" stroke="#4f7fae" stroke-width="1.6"/>
  <text x="100" y="152" font-size="12.5" font-weight="700" fill="#1c4f86" text-anchor="middle">隐藏状态</text>
  <text x="100" y="172" font-size="12.5" fill="#1c4f86" text-anchor="middle">h(ℓ,t)</text>
  <text x="100" y="196" font-size="12.5" fill="#3d5570" text-anchor="middle">d = 2048 维</text>
  <g stroke="#9db8d4" stroke-width="1">
    <line x1="58" y1="216" x2="142" y2="216"/><line x1="58" y1="224" x2="142" y2="224"/>
    <line x1="58" y1="232" x2="142" y2="232"/><line x1="58" y1="240" x2="142" y2="240"/>
    <line x1="58" y1="248" x2="142" y2="248"/><line x1="58" y1="256" x2="142" y2="256"/>
  </g>

  <line x1="166" y1="200" x2="252" y2="200" stroke="#4f5f72" stroke-width="1.8" marker-end="url(#ab)"/>
  <text x="209" y="188" font-size="12.5" fill="#3d5570" text-anchor="middle">乘 W(ℓ)</text>
  <text x="209" y="222" font-size="11.5" fill="#8b95a3" text-anchor="middle">形状 E × d</text>

  <rect x="262" y="126" width="150" height="150" rx="8" fill="#cfe0f2" stroke="#2f6ba4" stroke-width="1.6"/>
  <text x="337" y="152" font-size="12.5" font-weight="700" fill="#14406e" text-anchor="middle">路由打分</text>
  <text x="337" y="172" font-size="12.5" fill="#14406e" text-anchor="middle">z(ℓ,t) = W(ℓ) h(ℓ,t)</text>
  <text x="337" y="196" font-size="12.5" fill="#3d5570" text-anchor="middle">E = 64 维</text>
  <text x="337" y="230" font-size="11.5" fill="#3d5570" text-anchor="middle">64 个线性测量</text>
  <text x="337" y="250" font-size="11.5" fill="#3d5570" text-anchor="middle">就是 W(ℓ) 的 64 行</text>

  <!-- Panel 2: read back -->
  <text x="470" y="108" font-size="14" font-weight="700" fill="#1a2433">② 反读，64 个观测定不住 2048 个未知</text>

  <rect x="470" y="126" width="480" height="150" rx="8" fill="#f7fafd" stroke="#c3d6e8" stroke-width="1.4"/>
  <text x="490" y="152" font-size="12.5" fill="#3d5570">把读出写成方程，未知数是隐藏状态的 2048 个分量</text>
  <text x="490" y="174" font-size="12.5" fill="#3d5570">一层路由给出 64 个独立方程，按秩与零度关系</text>
  <text x="490" y="202" font-size="13" font-weight="700" fill="#14406e">可唯一确定的自由度 ≤ 64</text>
  <text x="490" y="228" font-size="13" font-weight="700" fill="#8f3a32">看不见的零空间 = 2048 − 64 = 1984 维</text>
  <text x="490" y="254" font-size="12" fill="#8b95a3">路由测量总量覆盖 d 需要 L × 64 ≥ 2048，即 L ≥ 32，论文未报 L</text>

  <!-- Panel 3: bar comparison -->
  <text x="30" y="316" font-size="14" font-weight="700" fill="#1a2433">③ 零空间里那部分成员信息，路由拿不到</text>

  <!-- bars -->
  <!-- axis -->
  <line x1="120" y1="440" x2="700" y2="440" stroke="#4f5f72" stroke-width="1.6"/>
  <line x1="120" y1="440" x2="120" y2="350" stroke="#4f5f72" stroke-width="1.6"/>
  <text x="112" y="352" font-size="12" fill="#3d5570" text-anchor="end">观察到的部分</text>
  <text x="112" y="444" font-size="12" fill="#3d5570" text-anchor="end">零空间</text>

  <!-- observed bar: 64/2048 = 3.1% of width 560 -> ~17.5 -->
  <rect x="120" y="356" width="17" height="84" fill="#2f6ba4"/>
  <text x="146" y="386" font-size="12.5" fill="#14406e">64 维，路由直接读到</text>
  <text x="146" y="404" font-size="11.5" fill="#8b95a3">占隐藏空间的 3.1%</text>

  <!-- null bar -->
  <rect x="120" y="444" width="543" height="84" fill="#e6b8b3"/>
  <text x="150" y="478" font-size="12.5" fill="#8f3a32">1984 维，任何路由读数都看不出来</text>
  <text x="150" y="498" font-size="11.5" fill="#a8706a">占隐藏空间的 96.9%，占比按宽度等比绘制</text>
  <text x="120" y="552" font-size="12" fill="#8b95a3">横轴是隐藏空间里的维数，按等比例尺画，不是时间轴，也不是漂移量。</text>

  <!-- Panel 4: mechanistic result -->
  <text x="30" y="592" font-size="12.5" fill="#3d5570">论文 5.5 节两个 epoch 后的对照，同秩随机投影 AUROC 0.594，路由投影 0.661，随机线上界 0.5。</text>
  <text x="30" y="614" font-size="12.5" fill="#3d5570">零空间占九成以上，路由却比同样大小的随机子空间多读到一截，说明它挑的方向不是随机的。</text>
</svg>
