<svg xmlns="http://www.w3.org/2000/svg" width="720" height="530" viewBox="0 0 720 530" font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif">
  <rect width="720" height="530" fill="#ffffff"/>
  <text x="30" y="42" font-size="21" font-weight="bold" fill="#1c2b3a">示意图 A　扰动预算的标定</text>
  <text x="30" y="74" font-size="14" fill="#546e7a">StackCube，冻住的基座策略，每个 ε 跑 50 个 episode。数据来自论文表 7。</text>
  <line x1="80" y1="400" x2="690" y2="400" stroke="#37474f" stroke-width="1.6"/>
  <line x1="80" y1="130" x2="80" y2="400" stroke="#37474f" stroke-width="1.6"/>
  <g font-size="12" fill="#607d8b" text-anchor="end">
    <text x="72" y="405">0</text>
    <text x="72" y="345">20</text>
    <text x="72" y="285">40</text>
    <text x="72" y="225">60</text>
    <text x="72" y="165">80</text>
    <text x="72" y="135">100</text>
  </g>
  <line x1="80" y1="340" x2="690" y2="340" stroke="#eceff1" stroke-width="1"/>
  <line x1="80" y1="280" x2="690" y2="280" stroke="#eceff1" stroke-width="1"/>
  <line x1="80" y1="220" x2="690" y2="220" stroke="#eceff1" stroke-width="1"/>
  <line x1="80" y1="160" x2="690" y2="160" stroke="#eceff1" stroke-width="1"/>
  <rect x="90" y="184" width="58" height="216" fill="#90a4ae"/>
  <rect x="178" y="208" width="58" height="192" fill="#90a4ae"/>
  <rect x="266" y="274" width="58" height="126" fill="#90a4ae"/>
  <rect x="354" y="328" width="58" height="72" fill="#ef6c00"/>
  <rect x="442" y="358" width="58" height="42" fill="#90a4ae"/>
  <rect x="530" y="400" width="58" height="1" fill="#90a4ae"/>
  <rect x="618" y="400" width="58" height="1" fill="#90a4ae"/>
  <g font-size="13" fill="#37474f" text-anchor="middle">
    <text x="119" y="176">72.0</text>
    <text x="207" y="200">64.0</text>
    <text x="295" y="266">42.0</text>
    <text x="383" y="320" font-weight="bold" fill="#bf360c">24.0</text>
    <text x="471" y="350">14.0</text>
    <text x="559" y="392">0.0</text>
    <text x="647" y="392">0.0</text>
  </g>
  <g font-size="13" fill="#37474f" text-anchor="middle">
    <text x="119" y="422">0</text>
    <text x="207" y="422">0.001</text>
    <text x="295" y="422">0.003</text>
    <text x="383" y="422">0.005</text>
    <text x="471" y="422">0.01</text>
    <text x="559" y="422">0.02</text>
    <text x="647" y="422">0.05</text>
  </g>
  <text x="385" y="452" font-size="14" font-weight="bold" fill="#37474f" text-anchor="middle">扰动预算 ε（每个动作坐标的上界）</text>
  <text x="30" y="478" font-size="12" fill="#607d8b">竖轴是成功率（%），来自论文表 7 的 StackCube 一行。</text>
  <text x="30" y="500" font-size="12" fill="#607d8b">橙色柱是论文实际采用的 0.005。左边那段扰动改不动结果，右边那段所有状态都像关键状态。</text>
</svg>
